q('商業簿記','仕訳基礎','商品を掛けで販売した。基本仕訳として正しいものは？',['売掛金／売上','売上／売掛金','現金／売上','仕入／買掛金'],0,'掛売上では売掛金が増加し、売上を認識する。','掛仕入の仕訳と混同しやすい');
q('商業簿記','仕訳基礎','買掛金を普通預金から支払った。基本仕訳は？',['買掛金／普通預金','普通預金／買掛金','仕入／普通預金','支払利息／現金'],0,'負債の買掛金を減らし、預金を減らす。','売掛金回収と左右が逆になる');
q('商業簿記','税金・税効果','法人税等を計上する仕訳で、費用側に使う代表的勘定は？',['法人税、住民税及び事業税','繰延税金資産','資本金','売上'],0,'当期の法人税等は税金費用として計上する。','繰延税金資産・負債との区別が重要');
q('商業簿記','連結会計','親会社の子会社に対する売掛金と子会社の親会社に対する買掛金は連結上どうする？',['相殺消去する','売上にする','固定資産にする','そのまま残す'],0,'企業集団内部の債権債務なので相殺消去する。','外部債権債務と混同しやすい');

let state=JSON.parse(localStorage.getItem(KEY)||'{}');if(!state.wrong)state.wrong={};if(!state.conf)state.conf={};if(!state.history)state.history=[];let session=[];let pos=0;let mode='';
const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function home(){app.innerHTML=`<h1>📘 日商簿記1級 学習ツール v16</h1><div class="card"><b>全4科目・実質ユニーク問題で練習</b><p class="small">日本商工会議所の現行区分を基準に構成。2026年度は2022年度区分表が適用。</p></div><button class="primary" onclick="learn()">📖 勉強する</button><button onclick="rapid()">⚡ とにかく解く</button><button onclick="journal()">✏️ 仕訳を解く</button><button onclick="why()">🧠 なぜこの仕訳？</button><button onclick="confusion()">🔀 似た仕訳を見分ける</button><button onclick="predict()">🔮 予想問題</button><button onclick="status()">📊 学習状況・昨日の学習</button><div class="card"><b>問題数：${Q.length}問</b><p class="small">同じ問題文の水増しはせず、1問ずつ別の論点・判断ポイントを持たせています。</p></div>`}
function learn(){app.innerHTML='<h1>📖 勉強する</h1><p class="small">科目→論点を選んで、5・10問から選べます。</p>'+Object.entries(topics).map(([c,ts])=>`<div class="card"><h2>${c}</h2>${ts.map(t=>`<button onclick="topic('${c}','${t}')">${t} <span class="small">${Q.filter(x=>x.cat==c&&x.topic==t).length}問</span></button>`).join('')}</div>`).join('')+`<button onclick="home()">← 戻る</button>`}
function topic(c,t){let n=prompt(`${c}「${t}」\n何問解く？ 5 または 10`,'5');n=Number(n);if(![5,10].includes(n)){alert('5か10を入力してね');return}let pool=Q.filter(x=>x.cat==c&&x.topic==t);if(!pool.length){alert('この論点はまだ問題を用意できていません。水増しはせず、追加待ちにしています。');return}start(pool,n,'topic')}
function rapid(){let n=prompt('何問解く？ 10・50・100','10');n=Number(n);if(![10,50,100].includes(n)){alert('10・50・100のどれか');return}start([...Q],n,'rapid')}
function journal(){let pool=Q.filter(x=>x.cat==='商業簿記'&&['仕訳基礎','税金・税効果','連結会計','現金預金','手形'].includes(x.topic));if(!pool.length)return;start(pool,10,'journal')}
function why(){let pool=Q.filter(x=>x.cat==='商業簿記'&&['仕訳基礎','税金・税効果','連結会計','手形'].includes(x.topic));session=shuffle(pool).slice(0,Math.min(10,pool.length));pos=0;mode='why';renderWhy()}
function confusion(){let pool=Q.filter(x=>x.x);session=shuffle(pool).slice(0,10);pos=0;mode='conf';renderQ()}
function predict(){let ranked=[...Q].sort((a,b)=>(state.wrong[b.topic]||0)-(state.wrong[a.topic]||0));start(ranked.slice(0,Math.max(10,Math.min(20,ranked.length))),10,'predict')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(pool,n,m){session=shuffle(pool);if(session.length<n){session=[...session,...shuffle(pool)];}session=session.slice(0,n);pos=0;mode=m;renderQ()}
function renderQ(){if(pos>=session.length){finish();return}let x=session[pos],arr=x.c.map((v,i)=>({v,i}));arr=shuffle(arr);app.innerHTML=`<div class="small">${pos+1} / ${session.length}　<span class="tag">${x.cat}</span><span class="tag">${x.topic}</span></div><div class="card"><h2>${esc(x.q)}</h2>${arr.map(o=>`<button class="choice" onclick="answer(${o.i},this)">${esc(o.v)}</button>`).join('')}</div>`}
function answer(i,btn){let x=session[pos],ok=i===x.a;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');if(!ok){state.wrong[x.topic]=(state.wrong[x.topic]||0)+1;state.conf[x.x]=(state.conf[x.x]||0)+1}state.history.push({d:new Date().toISOString().slice(0,10),cat:x.cat,topic:x.topic,ok});save();setTimeout(()=>{app.innerHTML+=`<div class="card"><b>${ok?'正解':'不正解'}</b><p>${esc(x.e)}</p><p class="small">混同ポイント：${esc(x.x)}</p><button class="primary" onclick="pos++;renderQ()">次へ</button></div>`},200)}
function renderWhy(){if(pos>=session.length){finish();return}let x=session[pos],arr=x.c.map((v,i)=>({v,i}));arr=shuffle(arr);app.innerHTML=`<div class="small">${pos+1} / ${session.length}</div><div class="card"><div class="tag">なぜこの仕訳？</div><h2>この処理をする理由として最も近いものは？</h2><p><b>${esc(x.c[x.a])}</b></p>${arr.map(o=>`<button class="choice" onclick="answer(${o.i},this)">${esc(['資産・負債・純資産・収益・費用の増減関係から説明する','取引の経済的実態を表すため','税金を減らすため','単に左右を暗記するため'][o.i%4])}</button>`).join('')}</div>`}
function finish(){save();app.innerHTML=`<div class="card"><h2>終了</h2><p>${session.length}問おつかれさま。</p><button class="primary" onclick="home()">ホームへ</button></div>`}
function status(){let today=new Date().toISOString().slice(0,10),ys=new Date(Date.now()-86400000).toISOString().slice(0,10);let t=state.history.filter(x=>x.d===today),y=state.history.filter(x=>x.d===ys);let by={};state.history.forEach(x=>{by[x.topic]??={n:0,w:0};by[x.topic].n++;if(!x.ok)by[x.topic].w++});let rows=Object.entries(by).sort((a,b)=>b[1].w-a[1].w).slice(0,20);app.innerHTML=`<h1>📊 学習状況</h1><div class="card"><b>今日：${t.length}問　昨日：${y.length}問</b><p>昨日も含めて、論点別に記録しています。</p></div><div class="card"><h2>苦手・混同しやすい論点</h2>${rows.length?rows.map(([k,v])=>`<p>${k}：${v.n}問中 ${v.w}問ミス</p>`).join(''):'まだ記録がありません。'}</div><div class="card"><h2>混同ポイント</h2>${Object.entries(state.conf).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<p>${k}：${v}回</p>`).join('')||'まだありません'}</div><button onclick="home()">← 戻る</button>`}
home();
</script></div></body></html>
