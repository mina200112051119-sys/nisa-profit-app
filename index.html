<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="新NISA利益予測"><title>新NISA利益予測</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#c9151e;color:#fff;padding:22px 18px}header b{font-size:24px}header p{margin:6px 0 0;font-size:14px}main{max-width:720px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 7px #0001}h2{margin:0 0 13px;font-size:21px}h3{margin:15px 0 8px}.small{font-size:13px;color:#777;line-height:1.6}.notice{background:#fff7d6;border-radius:14px;padding:13px;font-size:14px;line-height:1.6;margin-bottom:13px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:5px 0}button{border:0;border-radius:12px;background:#c9151e;color:#fff;font-weight:700;padding:13px 15px;font-size:15px}.full{width:100%;margin-top:8px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.quick button{background:#eee;color:#333;padding:9px 11px;font-size:13px}.tag{display:inline-block;background:#f1f1f1;border-radius:8px;padding:4px 7px;margin:3px 3px 0 0;font-size:12px}.saved{padding:14px 0;border-bottom:1px solid #eee}.savedTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.delete{background:#eee;color:#333;font-size:12px;padding:8px}.prediction{background:#f8f8f8;border-radius:14px;padding:14px;margin-top:10px}.scenario{background:#fff;border:1px solid #eee;border-radius:12px;padding:13px;margin-top:9px}.big{font-size:22px;font-weight:800}.loss{font-size:20px;font-weight:800}.empty{color:#777;font-size:13px}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}nav button{flex:1;background:transparent;color:#555;border-radius:0;font-size:13px}nav button.active{color:#c9151e}</style></head><body><header><b>新NISA利益予測</b><p>話題のテーマ・商品を選んで3パターン予測</p></header><main><section id="home"><div class="card"><h2>商品を登録</h2><div class="notice">楽天証券のCSVは使いません。<b>商品名だけ</b>で登録できます。</div><input id="productName" placeholder="例：三菱重工業"><button class="full" onclick="addProduct()">この商品を登録</button><div id="result"></div></div><div class="card"><h2>登録した商品</h2><div id="saved"></div></div></section><section id="search" class="hidden"><div class="card"><h2>話題の商品を探す</h2><p class="small">検索しなくても一覧を表示します。商品名でもテーマでも探せます。</p><div class="quick"><button onclick="quickSearch('AI')">AI</button><button onclick="quickSearch('半導体')">半導体</button><button onclick="quickSearch('防衛')">防衛</button><button onclick="quickSearch('宇宙')">宇宙</button><button onclick="quickSearch('電力')">電力</button><button onclick="quickSearch('レアアース')">レアアース</button></div><input id="searchBox" placeholder="商品名・テーマで検索" oninput="searchProducts()"><div id="searchResult"></div></div></section><section id="info" class="hidden"><div class="card"><h2>予測について</h2><p class="small">商品ごとに下落・標準・上昇の3パターンの参考年率を設定しています。</p><p class="small">参考年率と参考スコアは、このアプリ用に設定した目安です。将来の利益を保証するものではありません。</p></div></section></main><nav><button id="nHome" class="active" onclick="show('home','nHome')">商品登録</button><button id="nSearch" onclick="show('search','nSearch')">商品検索</button><button id="nInfo" onclick="show('info','nInfo')">説明</button></nav><script>
const KEY='nisaProductsOnly';let products=JSON.parse(localStorage.getItem(KEY)||'[]');
const starter=[['eMAXIS Slim 米国株式（S&P500）','投資信託','米国株・AI',8,-5,12,72],['eMAXIS Slim 全世界株式（オール・カントリー）','投資信託','全世界',7,-4,11,75],['iFreeNEXT NASDAQ100インデックス','投資信託','AI・半導体・IT',10,-10,16,64],['iFreeNEXT FANG+インデックス','投資信託','AI・大型テック',12,-15,20,58],['eMAXIS Slim 国内株式（日経平均）','投資信託','日本株',7,-8,14,68],['アドバンテスト（6857）','個別株','AI・半導体',13,-30,35,62],['東京エレクトロン（8035）','個別株','半導体製造装置',11,-25,28,68],['キオクシアホールディングス（285A）','個別株','半導体・メモリ',14,-35,40,55],['フジクラ（5803）','個別株','データセンター・電力インフラ',12,-25,30,61],['三菱重工業（7011）','個別株','防衛・宇宙・電力',9,-20,24,70],['IHI（7013）','個別株','防衛・航空宇宙',10,-25,28,63],['川崎重工業（7012）','個別株','防衛・航空宇宙・造船',9,-22,25,65],['QPS研究所（5595）','個別株','宇宙・衛星',12,-35,40,48],['ispace（9348）','個別株','宇宙・月面開発',10,-40,45,42],['三菱UFJフィナンシャル・グループ（8306）','個別株','銀行・金利上昇',7,-18,16,69],['東京電力ホールディングス（9501）','個別株','電力・原発',6,-25,25,45],['東洋エンジニアリング（6330）','個別株','海底レアアース・エンジニアリング',12,-25,30,45],['岡本硝子（7746）','個別株','海底レアアース',10,-20,28,42],['三井海洋開発（6269）','個別株','海洋開発・海底資源',8,-15,22,55],['INPEX（1605）','個別株','資源・エネルギー',7,-20,20,65]];
function obj(a){return{name:a[0],type:a[1],theme:a[2],base:a[3],down:a[4],up:a[5],confidence:a[6]}}const list=starter.map(obj);
function clean(n){return String(n).replace(/[（(]\d{4}[A-Z]?\d{0,3}[）)]$/,'').trim().toLowerCase()}function findStarter(name){let n=clean(name);return list.find(x=>clean(x.name)===n||clean(x.name).startsWith(n)||n.startsWith(clean(x.name)))}
products=products.map(p=>{let s=findStarter(p.name);return s?{...p,...s,name:s.name}:p});localStorage.setItem(KEY,JSON.stringify(products));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function score(p){return p.confidence||65}function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}
function addProduct(){let input=document.getElementById('productName'),name=input.value.trim();if(!name){result.innerHTML='<p class="empty">商品名を入力してください。</p>';return}let s=findStarter(name),canonical=s?s.name:name,old=products.findIndex(p=>clean(p.name)===clean(canonical));if(old>=0){if(s){products[old]={...products[old],...s};save();result.innerHTML='<p><b>'+esc(s.name)+'</b>を更新しました。</p>'}else result.innerHTML='<p class="empty">登録済みです。</p>';return}products.push(s?{...s}:{name:canonical,type:'登録商品',theme:'未分類',base:5,down:-5,up:10,confidence:65});save();input.value='';result.innerHTML='<p><b>'+esc(canonical)+'</b>を登録しました。</p>'}
function removeProduct(i){products.splice(i,1);save()}
function render(){let arr=products.map((x,i)=>({x,i})).sort((a,b)=>score(b.x)-score(a.x));saved.innerHTML=arr.length?arr.map(({x,i})=>'<div class="saved"><div class="savedTop"><div><b>'+esc(x.name)+'</b><br><span class="tag">'+esc(x.theme||'未分類')+'</span> <span class="small">参考スコア '+score(x)+'%</span></div><button class="delete" onclick="removeProduct('+i+')">削除</button></div><button class="full" onclick="openPredict('+i+')">この商品で利益予測</button><div id="form'+i+'" class="prediction hidden"><h3>利益予測</h3><div class="small">下落 '+x.down+'% ／ 標準 +'+x.base+'% ／ 上昇 +'+x.up+'%</div><label>毎月の積立額（円）</label><input id="monthly'+i+'" type="number" inputmode="numeric" placeholder="30000"><label>積立期間（年）</label><input id="years'+i+'" type="number" inputmode="numeric" placeholder="20"><button class="full" onclick="calculate('+i+')">3パターンで計算</button><div id="calc'+i+'"></div></div></div>').join(''):'<p class="empty">まだ商品がありません。</p>'}
function openPredict(i){document.getElementById('form'+i).classList.toggle('hidden')}function fmt(v){return Math.round(v).toLocaleString('ja-JP')}function signed(v){return(v>=0?'+':'−')+fmt(Math.abs(v))}function future(m,y,rate){let n=Math.round(y*12),r=rate/100/12,f=r===0?m*n:m*((Math.pow(1+r,n)-1)/r);return{f,profit:f-m*n}}
function calculate(i){let m=Number(document.getElementById('monthly'+i).value),y=Number(document.getElementById('years'+i).value),p=products[i],out=document.getElementById('calc'+i);if(m<=0||y<=0){out.innerHTML='<p class="empty">積立額と期間を入力してください。</p>';return}let html='<p class="small">'+esc(p.theme||'未分類')+' ／ 参考スコア '+score(p)+'%（当たる確率ではありません）</p><div>積立元金</div><div class="big">'+fmt(m*y*12)+'円</div>';[["下落ケース",p.down],["標準ケース",p.base],["上昇ケース",p.up]].forEach(c=>{let z=future(m,y,c[1]);html+='<div class="scenario"><b>'+c[0]+'</b><div class="small">参考年率 '+(c[1]>=0?'+':'')+c[1]+'%</div><div>将来の評価額</div><div class="big">'+fmt(z.f)+'円</div><div>予想損益</div><div class="'+(z.profit<0?'loss':'big')+'">'+signed(z.profit)+'円</div></div>'});out.innerHTML=html}
function show(id,navId){['home','search','info'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['nHome','nSearch','nInfo'].forEach(x=>document.getElementById(x).classList.toggle('active',x===navId));if(id==='search')searchProducts()}
function quickSearch(q){searchBox.value=q;searchProducts()}
function searchProducts(){let q=(document.getElementById('searchBox').value||'').trim().toLowerCase();let hits=list.filter(x=>!q||x.name.toLowerCase().includes(q)||x.theme.toLowerCase().includes(q)||x.type.toLowerCase().includes(q));let html='<p class="small">'+hits.length+'件表示</p>';hits.forEach((x,i)=>{html+='<div class="saved"><b>'+esc(x.name)+'</b><br><span class="tag">'+esc(x.theme)+'</span><br><span class="small">参考スコア '+x.confidence+'% ／ 標準 +'+x.base+'%</span><button class="full" onclick="registerStarter('+i+')">この商品を登録</button></div>'});document.getElementById('searchResult').innerHTML=html+(hits.length?'':'<p class="empty">該当する商品がありません。</p>')}
function registerStarter(i){let s=list[i];let old=products.findIndex(p=>clean(p.name)===clean(s.name));if(old<0)products.push({...s});else products[old]={...products[old],...s};save();show('home','nHome');document.getElementById('result').innerHTML='<p><b>'+esc(s.name)+'</b>を登録しました。</p>'}
render();
</script></body></html>
