<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="新NISA利益予測"><title>新NISA利益予測</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#c9151e;color:#fff;padding:22px 18px}header b{font-size:24px}main{max-width:720px;margin:auto;padding:14px 12px 95px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 7px #0001}h2{margin:0 0 13px;font-size:22px}h3{margin:18px 0 8px;font-size:18px}.small{font-size:13px;color:#777;line-height:1.6}.notice{background:#fff7d6;border-radius:14px;padding:13px;font-size:14px;line-height:1.65;margin-bottom:13px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}button{border:0;border-radius:12px;background:#c9151e;color:#fff;font-weight:700;padding:13px 15px;font-size:15px}.full{width:100%;margin-top:9px}.saved{padding:14px 0;border-bottom:1px solid #eee}.savedTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.delete{background:#eee;color:#333;font-size:12px;padding:8px 10px}.predict{margin-top:10px;width:100%}.prediction{background:#f8f8f8;border-radius:14px;padding:14px;margin-top:12px}.scenario{background:#fff;border-radius:12px;padding:12px;margin-top:10px;border:1px solid #eee}.big{font-size:22px;font-weight:800}.loss{font-size:20px;font-weight:800}.empty{color:#777;font-size:13px}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}nav button{flex:1;background:transparent;color:#555;border-radius:0;font-size:13px}nav button.active{color:#c9151e}</style></head><body><header><b>新NISA利益予測</b></header><main><section id="home"><div class="card"><h2>商品を登録</h2><div class="notice">楽天証券のCSVは使いません。<b>商品名だけ</b>で登録できます。</div><input id="productName" placeholder="例：eMAXIS Slim 米国株式（S&P500）"><button class="full" onclick="addProduct()">この商品を登録</button><div id="result"></div></div><div class="card"><h2>登録した商品</h2><div id="saved"></div></div></section><section id="search" class="hidden"><div class="card"><h2>商品を探す</h2><input id="searchBox" placeholder="商品名を入力"><button class="full" onclick="searchProducts()">検索</button><div id="searchResult"></div></div></section><section id="info" class="hidden"><div class="card"><h2>予測について</h2><p class="small">過去実績だけでなく、相場の上昇・通常・下落の3パターンで参考計算します。</p><p class="small">将来の結果を保証するものではありません。</p></div></section></main><nav><button id="nHome" class="active" onclick="show('home','nHome')">商品登録</button><button id="nSearch" onclick="show('search','nSearch')">商品検索</button><button id="nInfo" onclick="show('info','nInfo')">説明</button></nav><script>
const KEY='nisaProductsOnly';let products=JSON.parse(localStorage.getItem(KEY)||'[]');
const starter=[{name:'eMAXIS Slim 米国株式（S&P500）',type:'投資信託',base:7,nisa:'つみたて投資枠・成長投資枠'},{name:'eMAXIS Slim 全世界株式（オール・カントリー）',type:'投資信託',base:6,nisa:'つみたて投資枠・成長投資枠'}];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}
function addProduct(){let input=document.getElementById('productName'),name=input.value.trim();if(!name){result.innerHTML='<p class="empty">商品名を入力してください。</p>';return}if(products.some(x=>x.name===name)){result.innerHTML='<p class="empty">登録済みです。</p>';return}let s=starter.find(x=>x.name===name);products.push({name,type:s?s.type:'登録商品',base:s?s.base:null,nisa:s?s.nisa:'商品名のみ'});save();input.value='';result.innerHTML='<p><b>'+esc(name)+'</b>を登録しました。</p>'}
function removeProduct(i){products.splice(i,1);save()}
function render(){saved.innerHTML=products.length?products.map((x,i)=>'<div class="saved"><div class="savedTop"><div><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.type)+'</span></div><button class="delete" onclick="removeProduct('+i+')">削除</button></div><button class="predict" onclick="openPredict('+i+')">この商品で利益予測</button><div id="form'+i+'" class="prediction hidden"><h3>利益予測</h3><label>毎月の積立額（円）</label><input id="monthly'+i+'" type="number" inputmode="numeric" placeholder="例：30000"><label>積立期間（年）</label><input id="years'+i+'" type="number" inputmode="numeric" placeholder="例：20"><button class="full" onclick="calculate('+i+')">3パターンで計算</button><div id="calc'+i+'"></div></div></div>').join(''):'<p class="empty">まだ商品がありません。</p>'}
function openPredict(i){document.getElementById('form'+i).classList.toggle('hidden')}
function calculate(i){let m=Number(document.getElementById('monthly'+i).value),y=Number(document.getElementById('years'+i).value),p=products[i],out=document.getElementById('calc'+i);if(m<=0||y<=0){out.innerHTML='<p class="empty">積立額と期間を入力してください。</p>';return}if(p.base==null){out.innerHTML='<p class="empty">この商品は参考値が未登録です。</p>';return}let cases=[['下落ケース',p.base-15],['標準ケース',p.base],['上昇ケース',p.base+8]],n=Math.round(y*12),fmt=v=>Math.round(v).toLocaleString('ja-JP');let html='<p class="small">現在の相場環境を参考にした3パターンです。利回りは固定の予測値で、将来を保証しません。</p>';cases.forEach(c=>{let rate=c[1],r=rate/100/12,f=r===0?m*n:m*((Math.pow(1+r,n)-1)/r),principal=m*n,profit=f-principal;html+='<div class="scenario"><b>'+c[0]+'</b><div class="small">参考年率 '+rate+'％</div><div style="margin-top:7px">評価額</div><div class="big">'+fmt(f)+'円</div><div style="margin-top:6px">損益</div><div class="'+(profit<0?'loss':'big')+'">'+(profit>=0?'+':'')+fmt(profit)+'円</div></div>'});out.innerHTML='<div>積立元金</div><div class="big">'+fmt(m*n)+'円</div>'+html}
function searchProducts(){let q=searchBox.value.trim().toLowerCase();searchResult.innerHTML=starter.filter(x=>x.name.toLowerCase().includes(q)).map(x=>'<div class="saved"><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.type)+'　'+esc(x.nisa)+'</span><button class="full" onclick="useStarter(\''+esc(x.name).replace(/'/g,"\\'")+'\')">この商品を登録</button></div>').join('')||'<p class="empty">候補がありません。</p>'}
function useStarter(name){productName.value=name;show('home','nHome');window.scrollTo(0,0)}
function show(id,n){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(n).classList.add('active');window.scrollTo(0,0)}render();
</script></body></html>
