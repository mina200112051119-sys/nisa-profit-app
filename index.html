<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="新NISA利益予測"><title>新NISA利益予測</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#c9151e;color:#fff;padding:22px 18px}header b{font-size:24px}header p{margin:6px 0 0;font-size:14px}main{max-width:720px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 7px #0001}h2{margin:0 0 13px;font-size:21px}h3{margin:15px 0 8px}.small{font-size:13px;color:#777;line-height:1.6}.notice{background:#fff7d6;border-radius:14px;padding:13px;font-size:14px;line-height:1.6;margin-bottom:13px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:5px 0}button{border:0;border-radius:12px;background:#c9151e;color:#fff;font-weight:700;padding:13px 15px;font-size:15px}.full{width:100%;margin-top:8px}.saved{padding:14px 0;border-bottom:1px solid #eee}.savedTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.delete{background:#eee;color:#333;font-size:12px;padding:8px}.prediction{background:#f8f8f8;border-radius:14px;padding:14px;margin-top:10px}.scenario{background:#fff;border:1px solid #eee;border-radius:12px;padding:13px;margin-top:9px}.big{font-size:22px;font-weight:800}.loss{font-size:20px;font-weight:800}.empty{color:#777;font-size:13px}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}nav button{flex:1;background:transparent;color:#555;border-radius:0;font-size:13px}nav button.active{color:#c9151e}</style></head><body><header><b>新NISA利益予測</b><p>商品名＋積立額＋期間で3パターン予測</p></header><main><section id="home"><div class="card"><h2>商品を登録</h2><div class="notice">楽天証券のCSVは使いません。<b>商品名だけ</b>で登録できます。</div><input id="productName" placeholder="例：東洋エンジニアリング"><button class="full" onclick="addProduct()">この商品を登録</button><div id="result"></div></div><div class="card"><h2>登録した商品</h2><div id="saved"></div></div></section><section id="search" class="hidden"><div class="card"><h2>商品を探す</h2><input id="searchBox" placeholder="商品名を入力"><button class="full" onclick="searchProducts()">検索</button><div id="searchResult"></div></div></section><section id="info" class="hidden"><div class="card"><h2>予測について</h2><p class="small">商品ごとに下落・標準・上昇の3パターンの参考年率を設定しています。</p><p class="small">信頼度は当たる確率ではなく、このアプリ独自の参考スコアです。</p><p class="small">参考年率は将来の利益を保証するものではありません。</p></div></section></main><nav><button id="nHome" class="active" onclick="show('home','nHome')">商品登録</button><button id="nSearch" onclick="show('search','nSearch')">商品検索</button><button id="nInfo" onclick="show('info','nInfo')">説明</button></nav><script>
const KEY='nisaProductsOnly';let products=JSON.parse(localStorage.getItem(KEY)||'[]');
const starter=[
{name:'eMAXIS Slim 米国株式（S&P500）',type:'投資信託',base:8,down:-5,up:12,nisa:'つみたて投資枠・成長投資枠',confidence:72},
{name:'eMAXIS Slim 全世界株式（オール・カントリー）',type:'投資信託',base:7,down:-4,up:11,nisa:'つみたて投資枠・成長投資枠',confidence:75},
{name:'iFreeNEXT NASDAQ100インデックス',type:'投資信託',base:10,down:-10,up:16,nisa:'成長投資枠',confidence:64},
{name:'iFreeNEXT FANG+インデックス',type:'投資信託',base:12,down:-15,up:20,nisa:'つみたて投資枠・成長投資枠',confidence:58},
{name:'eMAXIS Slim 国内株式（日経平均）',type:'投資信託',base:7,down:-8,up:14,nisa:'つみたて投資枠・成長投資枠',confidence:68},
{name:'東洋エンジニアリング（6330）',type:'個別株・海底レアアース関連',base:12,down:-25,up:30,nisa:'成長投資枠',confidence:45},
{name:'岡本硝子（7746）',type:'個別株・海底レアアース関連',base:10,down:-20,up:28,nisa:'成長投資枠',confidence:42},
{name:'三井海洋開発（6269）',type:'個別株・海洋開発関連',base:8,down:-15,up:22,nisa:'成長投資枠',confidence:55}
];
function clean(n){return String(n).replace(/[（(]\d{4}[）)]$/,'').trim().toLowerCase()}
function findStarter(name){let n=clean(name);return starter.find(x=>clean(x.name)===n||clean(x.name).startsWith(n)||n.startsWith(clean(x.name)))}
products=products.map(p=>{let s=findStarter(p.name);return s?{...p,...s,name:s.name}:p});localStorage.setItem(KEY,JSON.stringify(products));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}
function score(p){return p.confidence||65}
function addProduct(){let input=document.getElementById('productName'),name=input.value.trim();if(!name){result.innerHTML='<p class="empty">商品名を入力してください。</p>';return}let s=findStarter(name),canonical=s?s.name:name,old=products.findIndex(p=>clean(p.name)===clean(canonical));if(old>=0){if(s){products[old]={...products[old],...s};save();result.innerHTML='<p><b>'+esc(s.name)+'</b>を最新設定に更新しました。</p>'}else result.innerHTML='<p class="empty">登録済みです。</p>';return}products.push(s?{...s}:{name:canonical,type:'登録商品',base:5,down:-5,up:10,nisa:'商品名のみ',confidence:65});save();input.value='';result.innerHTML='<p><b>'+esc(canonical)+'</b>を登録しました。</p>'}
function removeProduct(i){products.splice(i,1);save()}
function render(){let arr=products.map((x,i)=>({x,i})).sort((a,b)=>score(b.x)-score(a.x));saved.innerHTML=arr.length?arr.map(({x,i})=>'<div class="saved"><div class="savedTop"><div><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.type)+'　参考スコア '+score(x)+'%</span></div><button class="delete" onclick="removeProduct('+i+')">削除</button></div><button class="full" onclick="openPredict('+i+')">この商品で利益予測</button><div id="form'+i+'" class="prediction hidden"><h3>利益予測</h3><div class="small">下落 '+x.down+'% ／ 標準 +'+x.base+'% ／ 上昇 +'+x.up+'%</div><label>毎月の積立額（円）</label><input id="monthly'+i+'" type="number" inputmode="numeric" placeholder="30000"><label>積立期間（年）</label><input id="years'+i+'" type="number" inputmode="numeric" placeholder="20"><button class="full" onclick="calculate('+i+')">3パターンで計算</button><div id="calc'+i+'"></div></div></div>').join(''):'<p class="empty">まだ商品がありません。</p>'}
function openPredict(i){document.getElementById('form'+i).classList.toggle('hidden')}
function fmt(v){return Math.round(v).toLocaleString('ja-JP')}function signed(v){return(v>=0?'+':'−')+fmt(Math.abs(v))}
function future(m,y,rate){let n=Math.round(y*12),r=rate/100/12,f=r===0?m*n:m*((Math.pow(1+r,n)-1)/r);return{f,profit:f-m*n}}
function calculate(i){let m=Number(document.getElementById('monthly'+i).value),y=Number(document.getElementById('years'+i).value),p=products[i],out=document.getElementById('calc'+i);if(m<=0||y<=0){out.innerHTML='<p class="empty">積立額と期間を入力してください。</p>';return}let html='<p class="small">参考スコア '+score(p)+'%（当たる確率ではありません）</p><div>積立元金</div><div class="big">'+fmt(m*y*12)+'円</div>';[["下落ケース",p.down],["標準ケース",p.base],["上昇ケース",p.up]].forEach(c=>{let z=future(m,y,c[1]);html+='<div class="scenario"><b>'+c[0]+'</b><div class="small">参考年率 '+(c[1]>=0?'+':'')+c[1]+'%</div><div>将来の評価額</div><div class="big">'+fmt(z.f)+'円</div><div>予想損益</div><div class="'+(z.profit<0?'loss':'big')+'">'+signed(z.profit)+'円</div></div>'});out.innerHTML=html}
function searchProducts(){let q=searchBox.value.trim().toLowerCase();searchResult.innerHTML=starter.filter(x=>!q||x.name.toLowerCase().includes(q)).map(x=>'<div class="saved"><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.type)+'　参考スコア '+x.confidence+'%</span><div class="small">下落 '+x.down+'% ／ 標準 +'+x.base+'% ／ 上昇 +'+x.up+'%</div><button class="full" onclick="useStarter(\''+x.name.replace(/'/g,"\\'")+'\')">この商品を登録</button></div>').join('')||'<p class="empty">候補がありません。</p>'}
function useStarter(name){document.getElementById('productName').value=name;show('home','nHome');window.scrollTo(0,0)}
function show(id,n){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(n).classList.add('active');window.scrollTo(0,0)}
render();</script></body></html>
