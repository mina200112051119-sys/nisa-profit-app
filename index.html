<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c9151e">
<title>NISA利益予測</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#c9151e;color:#fff;padding:16px 16px 13px;position:sticky;top:0;z-index:10}
header b{font-size:18px}.sub{font-size:11px;opacity:.85;margin-top:3px}
main{max-width:720px;margin:auto;padding:12px 12px 90px}
.card{background:#fff;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f7f8fa;border-radius:13px;padding:12px}
.metric span{font-size:11px;color:#777}.metric b{display:block;font-size:19px;margin-top:4px}
.red{color:#c9151e}.green{color:#178443}
button{border:0;border-radius:12px;background:#c9151e;color:#fff;font-weight:700;padding:12px 14px;font-size:14px}
button.secondary{background:#eee;color:#333}.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;overflow:auto;gap:7px;margin:10px 0}.tab{white-space:nowrap;padding:9px 12px;border-radius:99px;background:#eee;font-size:12px}.tab.on{background:#c9151e;color:#fff}
.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item b{font-size:14px}.small{font-size:11px;color:#777;line-height:1.6}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:15px;background:#fff;margin:4px 0 9px}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eee;font-size:10px;margin-left:5px}
.score{font-size:28px;font-weight:800}.bar{height:9px;background:#eee;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#c9151e}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;gap:10px;padding:8px;z-index:20}
nav button{background:transparent;color:#555;font-size:11px;padding:7px 18px}nav button.active{color:#c9151e}
.hidden{display:none}.drop{border:2px dashed #ccc;text-align:center;padding:20px;border-radius:14px;margin:8px 0}
</style></head>
<body>
<header><b>新NISA利益予測</b><div class="sub">iPhone専用・明細取り込み版</div></header>
<main>
<section id="home">
<div class="card"><h2>あなたの資産</h2><div class="grid">
<div class="metric"><span>投資元本</span><b id="invest">0円</b></div>
<div class="metric"><span>現在の評価額</span><b id="value">0円</b></div>
<div class="metric"><span>利益額</span><b id="profit" class="red">0円</b></div>
<div class="metric"><span>利益率</span><b id="rate" class="red">0%</b></div>
</div></div>
<div class="card"><h3>10年後の予測</h3><div class="metric"><span>予測資産額</span><b id="future">0円</b></div><p class="small">年率5%で仮定した目安です。将来の利益を保証しません。</p></div>
<div class="card"><h3>予測の信頼度</h3><div class="score" id="score">— / 100</div><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><p class="small">利益が出る確率ではなく、予測に使える材料の多さを表します。</p></div>
</section>

<section id="rank" class="hidden">
<div class="card"><h2>ランキング</h2>
<div class="tabs">
<button class="tab on" onclick="rankBy('profit')">利益額</button>
<button class="tab" onclick="rankBy('rate')">利益率</button>
<button class="tab" onclick="rankBy('value')">評価額</button>
<button class="tab" onclick="rankBy('invest')">投資額</button>
<button class="tab" onclick="rankBy('future')">10年後</button>
<button class="tab" onclick="rankBy('score')">信頼度</button>
</div><div id="ranking"></div></div>
</section>

<section id="import" class="hidden">
<div class="card"><h2>明細を取り込む</h2>
<p class="small">楽天証券から保存したCSV・明細ファイルを「ファイル」から選びます。ID・パスワードは入力しません。</p>
<div class="drop"><button onclick="document.getElementById('file').click()">ファイルを選択</button><input id="file" type="file" accept=".csv,.txt,text/csv" style="display:none" onchange="importFile(event)"><p id="msg" class="small">CSVを選択してください</p></div>
<button class="secondary" onclick="clearData()">このiPhoneのデータを削除</button>
</div>
<div class="card"><h3>保存状況</h3><p class="small">商品数：<b id="count">0</b><br>最終更新：<b id="last">—</b></p></div>
</section>
</main>
<nav><button class="active" onclick="show('home',this)">ホーム</button><button onclick="show('rank',this)">ランキング</button><button onclick="show('import',this)">取込</button></nav>
<script>
let items=JSON.parse(localStorage.getItem('nisaItems')||'[]');
const yen=n=>Math.round(Number(n)||0).toLocaleString('ja-JP')+'円';
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='rank')rankBy('profit')}
function save(){localStorage.setItem('nisaItems',JSON.stringify(items));localStorage.setItem('nisaLast',new Date().toLocaleString('ja-JP'));render()}
function num(v){if(v==null)return 0;let s=String(v).replace(/[¥￥,\s%]/g,'');let n=Number(s);return Number.isFinite(n)?n:0}
function normalize(row){
 let keys=Object.keys(row), get=(...names)=>{let k=keys.find(x=>names.some(n=>x.replace(/\s/g,'').toLowerCase().includes(n)));return k?row[k]:''};
 let name=get('商品名','銘柄名称','銘柄名','name')||'名称不明', code=get('コード','銘柄コード','code');
 let invest=num(get('取得金額','投資額','取得価額','平均取得価額','avgcost'));
 let value=num(get('評価額','時価評価額','評価金額','marketvalue'));
 let profit=num(get('評価損益額','評価損益','損益額','profit'));
 let rate=num(get('評価損益率','損益率','profitpct'));
 let qty=num(get('保有数量','数量','quantity'));
 if(!invest && value && profit) invest=value-profit;
 if(!profit && value && invest) profit=value-invest;
 if(!rate && invest) rate=profit/invest*100;
 let nisa=get('NISA','口座区分','口座');
 let future=value*Math.pow(1.05,10);
 let score=Math.min(100,Math.round(45+(rate>=-10?15:5)+(invest>0?20:0)+(value>0?10:0)+(qty>0?10:0)));
 return {name,code,invest,value,profit,rate,nisa,qty,future,score}
}
function parseCSV(text){
 let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
 if(lines.length<2) return [];
 let delim=lines[0].includes('\t')?'\t':',';
 const parseLine=s=>{let a=[],cur='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===delim&&!q){a.push(cur);cur=''}else cur+=c}a.push(cur);return a};
 let heads=parseLine(lines[0]), out=[];
 for(let i=1;i<lines.length;i++){let a=parseLine(lines[i]),o={};heads.forEach((h,j)=>o[h]=a[j]||'');out.push(o)}
 return out.map(normalize).filter(x=>x.name!=='名称不明'||x.value||x.invest)
}
function importFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let a=parseCSV(r.result);if(!a.length)throw 0;items=a;save();document.getElementById('msg').textContent=a.length+'件を取り込みました';}catch(err){document.getElementById('msg').textContent='CSVを読み込めませんでした。列名を確認してください。'}};r.readAsText(f,'UTF-8')}
function render(){
 let inv=items.reduce((s,x)=>s+x.invest,0),val=items.reduce((s,x)=>s+x.value,0),p=val-inv;
 document.getElementById('invest').textContent=yen(inv);document.getElementById('value').textContent=yen(val);document.getElementById('profit').textContent=(p>=0?'+':'')+yen(p);document.getElementById('rate').textContent=(inv?p/inv*100:0).toFixed(1)+'%';
 document.getElementById('future').textContent=yen(val*Math.pow(1.05,10));
 let sc=items.length?Math.round(items.reduce((s,x)=>s+x.score,0)/items.length):0;document.getElementById('score').textContent=items.length?sc+' / 100':'— / 100';document.getElementById('fill').style.width=sc+'%';
 document.getElementById('count').textContent=items.length;document.getElementById('last').textContent=localStorage.getItem('nisaLast')||'—';
}
function rankBy(k){
 let arr=[...items].sort((a,b)=>(b[k]||0)-(a[k]||0));
 document.getElementById('ranking').innerHTML=arr.map((x,i)=>`<div class="item"><b>${i+1}. ${x.name}</b>${x.nisa?'<span class="badge">'+x.nisa+'</span>':''}<div class="small">${x.code||''}<br>投資 ${yen(x.invest)}　評価 ${yen(x.value)}　利益 ${yen(x.profit)}　利益率 ${x.rate.toFixed(1)}%<br>10年後 ${yen(x.future)}　信頼度 ${x.score}/100</div></div>`).join('')||'<p class="small">まず明細を取り込んでください。</p>';
}
function clearData(){if(confirm('このiPhoneに保存した明細を削除しますか？')){items=[];localStorage.removeItem('nisaItems');localStorage.removeItem('nisaLast');render();}}
render();
</script></body></html>
