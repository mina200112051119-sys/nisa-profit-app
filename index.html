<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="新NISA利益予測">
<meta name="theme-color" content="#c9151e">
<title>新NISA利益予測</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#c9151e;color:#fff;padding:18px}header b{font-size:20px}header p{margin:5px 0 0;font-size:12px;opacity:.9}
main{max-width:720px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border-radius:17px;padding:17px;margin-bottom:12px;box-shadow:0 1px 6px #0001}
h2{margin:0 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:17px}.small{font-size:12px;color:#777;line-height:1.6}.notice{background:#fff7d6;border-radius:13px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:12px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}button{border:0;border-radius:12px;background:#c9151e;color:#fff;font-weight:700;padding:13px 15px;font-size:15px}.full{width:100%;margin-top:9px}
.product{padding:14px 0;border-bottom:1px solid #eee}.product:last-child{border:0}.badge{display:inline-block;background:#eee;border-radius:99px;padding:4px 8px;font-size:11px;margin-top:5px}
.empty{color:#777;font-size:13px}.saved{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.saved:last-child{border:0}.delete{background:#eee;color:#333;font-size:12px;padding:8px 10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:transparent;color:#555;border-radius:0;font-size:12px;padding:11px 4px}nav button.active{color:#c9151e}
.hidden{display:none}.result{margin-top:12px}
</style>
</head>
<body>
<header><b>新NISA利益予測</b><p>商品名だけで登録できるiPhone版</p></header>
<main>
<section id="home">
<div class="card">
<h2>商品を登録</h2>
<div class="notice">楽天証券のCSVや取引明細は使いません。<b>商品名だけ</b>を入力して登録できます。</div>
<input id="productName" type="text" placeholder="例：eMAXIS Slim 米国株式（S&P500）">
<button class="full" onclick="addProduct()">この商品を登録</button>
<div id="result" class="result"></div>
</div>
<div class="card">
<h2>登録した商品</h2>
<div id="saved"></div>
</div>
</section>

<section id="search" class="hidden">
<div class="card">
<h2>商品を探す</h2>
<p class="small">よく使われるNISA商品から検索できます。</p>
<input id="searchBox" type="text" placeholder="商品名を入力">
<button class="full" onclick="searchProducts()">検索</button>
<div id="searchResult" class="result"></div>
</div>
</section>

<section id="info" class="hidden">
<div class="card">
<h2>このアプリについて</h2>
<p class="small">この版では、取引明細やCSVを取り込まず、商品名だけを登録します。</p>
<p class="small">商品名だけでは、投資した金額や実際の利益額は計算できません。数字を勝手に作らず、必要な情報がない場合は表示しません。</p>
</div>
</section>
</main>
<nav>
<button id="nHome" class="active" onclick="show('home','nHome')">商品登録</button>
<button id="nSearch" onclick="show('search','nSearch')">商品検索</button>
<button id="nInfo" onclick="show('info','nInfo')">説明</button>
</nav>
<script>
const KEY='nisaProductsOnly';
let products=JSON.parse(localStorage.getItem(KEY)||'[]');
const starter=[
 {name:'eMAXIS Slim 米国株式（S&P500）',type:'投資信託',nisa:'つみたて投資枠・成長投資枠'},
 {name:'eMAXIS Slim 全世界株式（オール・カントリー）',type:'投資信託',nisa:'つみたて投資枠・成長投資枠'},
 {name:'楽天・プラス・S&P500インデックス・ファンド',type:'投資信託',nisa:'つみたて投資枠・成長投資枠'},
 {name:'楽天・プラス・オールカントリー株式インデックス・ファンド',type:'投資信託',nisa:'つみたて投資枠・成長投資枠'}
];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}
function addProduct(){
 const input=document.getElementById('productName');const name=input.value.trim();
 if(!name){document.getElementById('result').innerHTML='<p class="empty">商品名を入力してください。</p>';return}
 if(products.some(x=>x.name===name)){document.getElementById('result').innerHTML='<p class="empty">この商品は登録済みです。</p>';return}
 products.push({name,type:'登録商品',nisa:'商品名のみ'});save();input.value='';document.getElementById('result').innerHTML='<p><b>'+esc(name)+'</b> を登録しました。</p>';
}
function removeProduct(i){products.splice(i,1);save()}
function render(){
 const el=document.getElementById('saved');
 el.innerHTML=products.length?products.map((x,i)=>'<div class="saved"><div><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.type)+'　｜　'+esc(x.nisa)+'</span></div><button class="delete" onclick="removeProduct('+i+')">削除</button></div>').join(''):'<p class="empty">まだ商品がありません。</p>';
}
function searchProducts(){
 const q=document.getElementById('searchBox').value.trim().toLowerCase();const el=document.getElementById('searchResult');
 if(!q){el.innerHTML='<p class="empty">商品名を入力してください。</p>';return}
 const hits=starter.filter(x=>x.name.toLowerCase().includes(q));
 el.innerHTML=hits.length?hits.map(x=>'<div class="product"><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.type)+'</span><br><span class="badge">'+esc(x.nisa)+'</span></div>').join(''):'<p class="empty">登録済みの候補にはありません。商品名をそのまま「商品登録」から登録できます。</p>';
}
function show(id,navId){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(navId).classList.add('active');}
render();
</script>
</body>
</html>
