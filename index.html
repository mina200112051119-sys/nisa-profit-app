<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>新NISA利益予測</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#c9151e;color:#fff;padding:22px 18px}header b{font-size:24px}main{max-width:720px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 1px 7px #0001}h2{margin:0 0 13px;font-size:21px}.small{font-size:13px;color:#777;line-height:1.6}.notice{background:#fff7d6;border-radius:14px;padding:13px;font-size:14px;line-height:1.6;margin-bottom:13px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:5px 0}button{border:0;border-radius:12px;background:#c9151e;color:#fff;font-weight:700;padding:13px 15px;font-size:15px}.full{width:100%;margin-top:8px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.quick button{background:#eee;color:#333;padding:9px 11px;font-size:13px}.saved{padding:14px 0;border-bottom:1px solid #eee}.tag{display:inline-block;background:#eee;border-radius:8px;padding:4px 7px;margin-top:5px;font-size:12px}.delete{background:#eee;color:#333;font-size:12px;float:right}.prediction{background:#f8f8f8;border-radius:14px;padding:14px;margin-top:10px}.scenario{background:#fff;border:1px solid #eee;border-radius:12px;padding:13px;margin-top:9px}.big{font-size:22px;font-weight:800}.hidden{display:none}.price{font-size:25px;font-weight:800}.pricebox{background:#f7f7f7;border-radius:14px;padding:12px;margin-top:9px}.error{color:#a00}.ok{color:#18733b;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}nav button{flex:1;background:transparent;color:#555;border-radius:0;font-size:13px}nav button.active{color:#c9151e}</style></head><body><header><b>新NISA利益予測</b><div>商品名で登録・検索。個別株は最新株価を確認できます</div></header><main><section id="home"><div class="card"><h2>商品を登録</h2><div class="notice">楽天証券のCSVは使いません。<b>商品名だけ</b>で登録できます。</div><input id="productName" placeholder="例：三菱重工業"><button id="addBtn" class="full" type="button">この商品を登録</button><div id="result"></div></div><div class="card"><h2>登録した商品</h2><div id="saved"></div></div></section><section id="search" class="hidden"><div class="card"><h2>商品を探す</h2><div class="small">商品名・テーマ・種類で検索できます。</div><div class="quick"><button type="button" onclick="quickSearch('AI')">AI</button><button type="button" onclick="quickSearch('半導体')">半導体</button><button type="button" onclick="quickSearch('防衛')">防衛</button><button type="button" onclick="quickSearch('宇宙')">宇宙</button><button type="button" onclick="quickSearch('電力')">電力</button><button type="button" onclick="quickSearch('レアアース')">レアアース</button><button type="button" onclick="quickSearch('今話題のもの')">今話題</button></div><input id="searchBox" placeholder="商品名・テーマで検索"><div id="searchResult"></div></div></section><section id="settings" class="hidden"><div class="card"><h2>株価の設定</h2><div class="notice">Twelve DataのAPIキーを保存すると、個別株の最新価格を取得できます。<b>APIキーは送らないでください。</b></div><input id="apiKey" type="password" placeholder="Twelve Data APIキー"><button id="apiSave" class="full" type="button">APIキーを保存</button><button id="apiClear" class="full" type="button" style="background:#eee;color:#333">APIキーを削除</button><p id="apiStatus" class="small"></p></div></section><section id="info" class="hidden"><div class="card"><h2>説明</h2><p class="small">下落・標準・上昇の3パターンで参考計算します。参考年率とスコアは目安で、将来の利益を保証するものではありません。</p></div></section><section id="topics"><div class="card"><h2>最新の話題</h2><div id="topicUpdated" class="small">読み込み中…</div><div id="topicThemes" class="quick"></div><div id="topicHeadlines"></div></div></section></main><nav><button id="nHome" class="active" type="button">商品登録</button><button id="nSearch" type="button">商品検索</button><button id="nSettings" type="button">株価設定</button><button id="nInfo" type="button">説明</button></nav><script>'use strict';const KEY='nisaProductsOnly',APIKEY='nisaTwelveDataKey';let products=[],apiKey=localStorage.getItem(APIKEY)||'',dynamicHot=[];try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){products=[]}const starter=[['eMAXIS Slim 米国株式（S&P500）','投資信託','米国株・AI',8,-5,12,72,''],['eMAXIS Slim 全世界株式（オール・カントリー）','投資信託','全世界',7,-4,11,75,''],['iFreeNEXT NASDAQ100インデックス','投資信託','AI・半導体・IT',10,-10,16,64,''],['iFreeNEXT FANG+インデックス','投資信託','AI・大型テック',12,-15,20,58,''],['eMAXIS Slim 国内株式（日経平均）','投資信託','日本株',7,-8,14,68,''],['アドバンテスト（6857）','個別株','AI・半導体',13,-30,35,62,'6857'],['東京エレクトロン（8035）','個別株','半導体製造装置',11,-25,28,68,'8035'],['キオクシアホールディングス（285A）','個別株','半導体・メモリ',14,-35,40,55,'285A'],['フジクラ（5803）','個別株','データセンター・電力インフラ',12,-25,30,61,'5803'],['三菱重工業（7011）','個別株','防衛・宇宙・電力',9,-20,24,70,'7011'],['IHI（7013）','個別株','防衛・航空宇宙',10,-25,28,63,'7013'],['川崎重工業（7012）','個別株','防衛・航空宇宙・造船',9,-22,25,65,'7012'],['QPS研究所（5595）','個別株','宇宙・衛星',12,-35,40,48,'5595'],['ispace（9348）','個別株','宇宙・月面開発',10,-40,45,42,'9348'],['三菱UFJフィナンシャル・グループ（8306）','個別株','銀行・金利上昇',7,-18,16,69,'8306'],['東京電力ホールディングス（9501）','個別株','電力・原発',6,-25,25,45,'9501'],['東洋エンジニアリング（6330）','個別株','海底レアアース・エンジニアリング',12,-25,30,45,'6330'],['岡本硝子（7746）','個別株','海底レアアース',10,-20,28,42,'7746'],['三井海洋開発（6269）','個別株','海洋開発・海底資源',8,-15,22,55,'6269'],['INPEX（1605）','個別株','資源・エネルギー',7,-20,20,65,'1605']];const staticHot=[['伊藤園（2593）','個別株','本日の話題・上昇',8,-20,20,60,'2593'],['ZenmuTech（338A）','個別株','本日の話題・サイバーセキュリティ',12,-35,40,52,'338A'],['かどや製油（2612）','個別株','本日の話題・食品・材料',7,-20,25,50,'2612'],['FFRIセキュリティ（3692）','個別株','本日の話題・サイバーセキュリティ',12,-30,35,58,'3692'],['キオクシアホールディングス（285A）','個別株','半導体・本日の話題',14,-35,40,55,'285A'],['フジクラ（5803）','個別株','データセンター・電力インフラ・本日の話題',12,-25,30,61,'5803']];const list=starter.concat(staticHot).map(a=>({name:a[0],type:a[1],theme:a[2],base:a[3],down:a[4],up:a[5],confidence:a[6],symbol:a[7]}));function clean(n){return String(n).replace(/[（(]\d{3,4}[A-Z]?\d{0,3}[）)]$/,'').trim().toLowerCase()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function score(p){return p.confidence||65}function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}function allProducts(){const a=list.concat(dynamicHot||[]),seen=new Set();return a.filter(x=>{const k=(x.name||'')+'|'+(x.symbol||'');if(seen.has(k))return false;seen.add(k);return true})}function findAny(n){const q=clean(n);return allProducts().find(x=>clean(x.name)===q)}function addProduct(){const el=document.getElementById('productName'),name=el.value.trim();if(!name){document.getElementById('result').innerHTML='<p>商品名を入力してください。</p>';return}const s=findAny(name),p=s?{...s}:{name:name,type:'登録商品',theme:'未分類',base:5,down:-5,up:10,confidence:65,symbol:''};if(products.some(x=>clean(x.name)===clean(p.name))){document.getElementById('result').innerHTML='<p><b>'+esc(p.name)+'</b>は登録済みです。</p>';return}products.push(p);save();el.value='';document.getElementById('result').innerHTML='<p><b>'+esc(p.name)+'</b>を登録しました。</p>'}function registerItem(p){if(!p)return;if(products.some(x=>clean(x.name)===clean(p.name))){document.getElementById('result').innerHTML='<p><b>'+esc(p.name)+'</b>は登録済みです。</p>'}else{products.push({...p});save();document.getElementById('result').innerHTML='<p><b>'+esc(p.name)+'</b>を登録しました。</p>'}show('home','nHome')}function removeProduct(i){products.splice(i,1);save()}function render(){const box=document.getElementById('saved');box.innerHTML=products.length?products.map((p,i)=>'<div class="saved"><button class="delete" type="button" data-del="'+i+'">削除</button><b>'+esc(p.name)+'</b><br><span class="tag">'+esc(p.theme||'未分類')+'</span> <span class="small">参考スコア '+score(p)+'%</span><div id="price'+i+'" class="pricebox">'+(p.type==='個別株'?(apiKey?'株価を確認できます。':'「株価設定」でAPIキーを保存してください。'):'投資信託：リアルタイム株価の対象外')+'</div>'+(p.type==='個別株'?'<button class="full" type="button" data-price="'+i+'">株価を見る</button>':'')+'<button class="full" type="button" data-predict="'+i+'">この商品で利益予測</button><div id="form'+i+'" class="prediction hidden"><div class="small">下落 '+p.down+'% ／ 標準 +'+p.base+'% ／ 上昇 +'+p.up+'%</div><input id="monthly'+i+'" type="number" placeholder="毎月の積立額（例：30000）"><input id="years'+i+'" type="number" placeholder="積立期間（年）"><button class="full" type="button" data-calc="'+i+'">3パターンで計算</button><div id="calc'+i+'"></div></div></div>').join(''):'<p class="small">まだ商品がありません。</p>';box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeProduct(+b.dataset.del));box.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>fetchPrice(products[+b.dataset.price]));box.querySelectorAll('[data-predict]').forEach(b=>b.onclick=()=>document.getElementById('form'+b.dataset.predict).classList.toggle('hidden'));box.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>calculate(+b.dataset.calc));if(apiKey)updateAllPrices()}function calculate(i){const m=+document.getElementById('monthly'+i).value,y=+document.getElementById('years'+i).value,p=products[i],o=document.getElementById('calc'+i);if(m<=0||y<=0){o.innerHTML='<p>積立額と期間を入力してください。</p>';return}let h='<p class="small">積立元金 '+Math.round(m*y*12).toLocaleString('ja-JP')+'円</p>';[["下落",p.down],["標準",p.base],["上昇",p.up]].forEach(c=>{const r=c[1]/100/12,n=y*12,f=r?m*((Math.pow(1+r,n)-1)/r):m*n,z=f-m*y*12;h+='<div class="scenario"><b>'+c[0]+'ケース</b><br>将来の評価額：<span class="big">'+Math.round(f).toLocaleString('ja-JP')+'円</span><br>予想損益：'+(z>=0?'+':'−')+Math.round(Math.abs(z)).toLocaleString('ja-JP')+'円</div>'});o.innerHTML=h}function searchProducts(){const raw=(document.getElementById('searchBox').value||'').trim(),q=raw.replace(/\s+/g,'').toLowerCase(),all=allProducts(),hotWords=['今話題のもの','今話題','話題のもの','話題'].map(x=>x.toLowerCase()),hits=hotWords.includes(q)?all.filter(x=>(x.theme||'').includes('本日の話題')):all.filter(x=>{const n=String(x.name).toLowerCase().replace(/\s+/g,''),t=String(x.theme||'').toLowerCase().replace(/\s+/g,''),k=String(x.type||'').toLowerCase().replace(/\s+/g,'');return !q||n.includes(q)||t.includes(q)||k.includes(q)});document.getElementById('searchResult').innerHTML='<p class="small">'+hits.length+'件表示　※「今話題」は自動更新</p>'+hits.map(x=>'<div class="saved"><b>'+esc(x.name)+'</b><br><span class="tag">'+esc(x.theme||'')+'</span>'+(x.reason?'<div class="small">'+esc(x.reason)+'</div>':'')+'<button class="full" type="button" data-item="'+all.indexOf(x)+'">この商品を登録</button></div>').join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>registerItem(all[+b.dataset.item]))}function quickSearch(q){document.getElementById('searchBox').value=q;searchProducts()}function show(id,n){['home','search','settings','info'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['nHome','nSearch','nSettings','nInfo'].forEach(x=>document.getElementById(x).classList.toggle('active',x===n));if(id==='search')searchProducts();if(id==='settings')document.getElementById('apiKey').value=apiKey}async function fetchPrice(p){if(!p||p.type!=='個別株'||!p.symbol)return;const i=products.indexOf(p),b=document.getElementById('price'+i);if(!b)return;if(!apiKey){b.innerHTML='<span class="error">「株価設定」でAPIキーを保存してください。</span>';return}b.innerHTML='株価を取得中…';try{const r=await fetch('https://api.twelvedata.com/price?symbol='+encodeURIComponent(p.symbol)+'&exchange=TSE&apikey='+encodeURIComponent(apiKey)),d=await r.json();b.innerHTML=d.price?'<b class="price">'+Number(d.price).toLocaleString('ja-JP')+' 円</b><br><span class="small">最新取得 '+new Date().toLocaleTimeString('ja-JP')+' ／ Twelve Data</span>':'<span class="error">株価を取得できませんでした。</span>'}catch(e){b.innerHTML='<span class="error">株価取得エラー。</span>'}}function updateAllPrices(){products.filter(p=>p.type==='個別株').forEach(fetchPrice)}async function loadHotStocks(){try{const d=await fetch('data/hot-stocks.json?v='+Date.now()).then(r=>r.json());dynamicHot=Array.isArray(d.stocks)?d.stocks:[];searchProducts()}catch(e){dynamicHot=[];searchProducts()}}function loadTopics(){fetch('data/topic-update.json?v='+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('topicUpdated').textContent=d.updated_at?'更新 '+new Date(d.updated_at).toLocaleString('ja-JP'):'更新情報なし';document.getElementById('topicThemes').innerHTML=(d.themes||[]).slice(0,6).map(x=>'<span class="tag">'+esc(x.name)+' '+x.count+'</span>').join(' ');document.getElementById('topicHeadlines').innerHTML=(d.headlines||[]).slice(0,8).map(x=>'<div class="saved"><a href="'+x.link+'" target="_blank" rel="noopener">'+esc(x.title)+'</a><div class="small">'+esc(x.source||'')+'</div></div>').join('')}).catch(()=>{})}document.getElementById('addBtn').onclick=addProduct;document.getElementById('searchBox').oninput=searchProducts;document.getElementById('nHome').onclick=()=>show('home','nHome');document.getElementById('nSearch').onclick=()=>show('search','nSearch');document.getElementById('nSettings').onclick=()=>show('settings','nSettings');document.getElementById('nInfo').onclick=()=>show('info','nInfo');document.getElementById('apiSave').onclick=()=>{apiKey=document.getElementById('apiKey').value.trim();apiKey?localStorage.setItem(APIKEY,apiKey):localStorage.removeItem(APIKEY);render()};document.getElementById('apiClear').onclick=()=>{apiKey='';localStorage.removeItem(APIKEY);document.getElementById('apiKey').value='';render()};setInterval(updateAllPrices,30000);setInterval(loadHotStocks,1800000);render();loadHotStocks();loadTopics();</script></body></html>
