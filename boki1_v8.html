function start(t,n){mode=t;score=0;idx=0;let src=t==='仕訳'?JQ:t==='計算'?C:ALL;if(t==='全部')src=shuffle(src);let weakArr=src.filter(q=>(state.w[q.topic]||0)>0);if(t==='全部'&&weakArr.length)src=shuffle(weakArr.concat(src));pool=shuffle(src).slice(0,Math.min(n,src.length));show()}
function weak(){let src=ALL.filter(q=>(state.w[q.topic]||0)>0);if(!src.length){alert('まだ弱点データがありません。まず問題を解いてください。');return}pool=shuffle(src);mode='弱点';idx=0;score=0;show()}
function show(){if(idx>=pool.length){document.getElementById('app').innerHTML='<div class="card"><h2>終了</h2><p>'+pool.length+'問中 '+score+'問正解</p><p>正答率 '+Math.round(score/pool.length*100)+'%</p><button class="primary" onclick="home()">ホームへ</button><button onclick="start(\''+mode+'\', '+pool.length+')">もう一度</button></div>';return}let q=pool[idx];let h='<div class="card"><span class="tag">'+q.type+'</span> <span class="tag">'+q.topic+'</span><p>'+ (idx+1)+' / '+pool.length+'</p><h3>'+q.q+'</h3>';if(q.type==='計算'){h+='<input id="ans" class="input" type="number" inputmode="decimal" placeholder="数字を入力"> <button class="primary" onclick="checkNum()">答える</button>'}else{q.opts=shuffle(q.opts);h+=q.opts.map((o,i)=>'<button onclick="checkJ(\''+encodeURIComponent(o)+'\')">'+o+'</button>').join('')}h+='</div>';document.getElementById('app').innerHTML=h}
function checkJ(enc){let q=pool[idx],pick=decodeURIComponent(enc),ok=pick===q.ans;result(ok,pick,q.ans)}
function checkNum(){let q=pool[idx],v=Number(document.getElementById('ans').value),ok=Math.abs(v-q.ans)<0.01;result(ok,v,q.ans)}
function result(ok,pick,ans){let q=pool[idx];state.total++;if(ok){state.ok++;score++}else state.w[q.topic]=(state.w[q.topic]||0)+1;localStorage.setItem('bokiV8',JSON.stringify(state));document.getElementById('app').innerHTML='<div class="card '+(ok?'ok':'ng')+'"><h2>'+(ok?'⭕ 正解':'❌ 不正解')+'</h2><p>正解：<b>'+ans+(q.unit||'')+'</b></p><p>'+q.exp+'</p><p>⚠️ 混同ポイント：'+q.conf+'</p><button class="primary" onclick="idx++;show()">次へ</button></div>'}
home();
</script></body></html>
