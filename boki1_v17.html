<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日商簿記1級 学習ツール v17</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f6f7fb;color:#222}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0000000d}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left}button.primary{background:#222;color:#fff}.small{font-size:13px;color:#666}.tag{display:inline-block;background:#eef2ff;padding:5px 8px;border-radius:8px;font-size:12px;margin:2px}.choice.correct{background:#dff5e5}.choice.wrong{background:#ffe1e1}h1{font-size:22px}h2{font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div class="wrap" id="app"></div><script>
const KEY='bokiV17';
const topics={
'商業簿記':['簿記の基本原理','現金預金','有価証券','売掛金と買掛金','その他の債権と債務','手形','債権の譲渡','引当金','債務の保証','商品の売買','収益認識','デリバティブ・金融商品','有形固定資産','無形固定資産','減損','投資その他の資産','繰延資産','リース','外貨建取引','資産除去債務','税金・税効果','決算','株式会社会計','本支店会計','連結会計','会計基準・法令'],
'会計学':['企業会計原則・基準','概念フレームワーク','財務諸表','株主資本等変動計算書','キャッシュ・フロー計算書','企業結合・事業分離','連結・包括利益','会社法・会社計算規則'],
'工業簿記':['工業簿記の本質','原価','原価計算','工業簿記の構造','材料費','労務費','経費','製造間接費','部門費','個別原価計算','総合原価計算','標準原価計算','製品の受払い','営業費','工場会計'],
'原価計算':['CVP分析','原価予測','直接原価計算','差額原価収益分析','意思決定','予算管理','戦略的原価計算']};
const core={
'簿記の基本原理':'資産・負債・純資産・収益・費用の増減を借方と貸方で記録する','現金預金':'現金過不足や銀行勘定調整などを通じて実際の現金・預金残高を適切に把握する','有価証券':'保有目的に応じて評価・評価差額の処理を区分する','売掛金と買掛金':'通常の営業取引から生じる債権・債務を適切に認識し回収・支払を管理する','その他の債権と債務':'貸付金・未収入金・未払金など営業外の債権債務を区分して処理する','手形':'手形の受取・振出・割引・裏書などに伴う債権債務を処理する','債権の譲渡':'金融資産の消滅要件を満たす場合に譲渡した債権の認識を中止する','引当金':'将来の費用・損失について当期に負担すべき額を合理的に見積もって認識する','債務の保証':'他社の債務を保証したことによる将来の損失可能性を適切に把握する','商品の売買':'商品の取得・販売に伴う仕入、売上、売上原価などを適切に処理する','収益認識':'顧客との契約について履行義務を識別し、充足した時点で収益を認識する','デリバティブ・金融商品':'デリバティブ等を原則として時価で評価し、適用される会計処理を行う','有形固定資産':'取得原価を基礎として減価償却などにより使用期間に費用配分する','無形固定資産':'ソフトウェアなど物理的実体のない資産を認識・償却・減損等により処理する','減損':'資産の回収可能性が低下した場合に帳簿価額を回収可能価額まで減額する','投資その他の資産':'長期保有目的の投資その他の資産を性質に応じて評価・表示する','繰延資産':'支出の効果が将来に及ぶ特定の支出を一定の要件のもとで繰延処理する','リース':'リース取引の実質に応じてリース資産やリース債務等を適切に認識する','外貨建取引':'外貨建金銭債権債務などを取引時・決算時の為替相場に基づいて換算する','資産除去債務':'将来の資産除去に必要な債務を現在価値等で負債認識し関連資産の取得原価に加える','税金・税効果':'会計上の利益と課税所得の差異による税効果を適切に期間配分する','決算':'決算整理を行い収益・費用を適切な期間に帰属させて財務諸表を作成する','株式会社会計':'資本金・資本剰余金・利益剰余金・自己株式など株主資本を適切に処理する','本支店会計':'本店と支店の取引を記録し企業全体の財務情報へ統合する','連結会計':'親会社と子会社を一つの企業集団として扱い内部取引等を消去して連結財務諸表を作成する','会計基準・法令':'企業会計原則・会計基準・会社法等のルールに基づいて会計処理を行う','企業会計原則・基準':'会計処理・表示の基本的な考え方を定めるルールに従って財務情報を作成する','概念フレームワーク':'財務報告の目的や会計情報の質的特性など基礎となる考え方を示す','財務諸表':'企業の財政状態、経営成績、キャッシュ・フロー等を一定の様式で報告する','株主資本等変動計算書':'純資産の各項目について期首から期末までの変動内容を表示する','キャッシュ・フロー計算書':'一定期間の現金及び現金同等物の増減を営業・投資・財務活動等に区分して示す','企業結合・事業分離':'取得企業を決定し取得原価を識別可能資産・負債等へ配分するなどして処理する','連結・包括利益':'当期純利益だけでなくその他の包括利益を含む企業集団の成果を報告する','会社法・会社計算規則':'会社の計算・分配等に関する法的ルールに従って会計・開示を行う','工業簿記の本質':'製造活動における原価の発生と製品への集計・配賦を記録する','原価':'製品やサービスのために消費された経済価値を目的に応じて分類する','原価計算':'製品原価の計算や原価管理・意思決定に必要な情報を提供する','工業簿記の構造':'材料・労務・経費等の原価を製造過程に集計し製品原価へ振り替える','材料費':'材料の消費額を適切な方法で計算し直接材料費や間接材料費に分類する','労務費':'作業時間等に基づいて賃金を製品・部門等へ集計する','経費':'材料費・労務費以外の製造に要した費用を適切に集計する','製造間接費':'製品へ直接追跡できない製造費を適切な配賦基準で製品へ配賦する','部門費':'製造部門・補助部門などへ費用を集計し必要に応じて製造部門へ配賦する','個別原価計算':'製造指図書などの単位ごとに原価を集計して製品原価を計算する','総合原価計算':'同種製品を連続生産する場合に一定期間の原価を製品単位へ平均的に配分する','標準原価計算':'標準原価と実際原価を比較し差異を分析する','製品の受払い':'完成品・製品の受入れや払出しを記録し在庫数量・金額を管理する','営業費':'販売費及び一般管理費など製造後の営業活動に要する費用を管理する','工場会計':'工場を独立した会計単位として記録し本社との取引を処理する','CVP分析':'売上高・変動費・固定費の関係から損益分岐点や目標利益を分析する','原価予測':'操業度などの変化に応じて将来の原価を予測する','直接原価計算':'変動費と固定費を区分し限界利益を用いて利益を分析する','差額原価収益分析':'代替案について増減する収益と原価に注目して比較する','意思決定':'意思決定に関連する将来の差額収益・差額原価などを比較する','予算管理':'予算を設定し実績との差異を分析して経営管理に役立てる','戦略的原価計算':'競争戦略や製品ライフサイクル等を考慮して長期的な原価・利益を管理する'};
let mode='home',pool=[],idx=0,score=0,answered=false;
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function make(cat,t){let c=core[t],ds=Object.values(core).filter(x=>x!==c);let forms=[`「${t}」の中心となる考え方として最も適切なものは？`,`次のうち「${t}」について正しい説明は？`,`「${t}」を学ぶ際に最も重要な考え方は？`,`「${t}」に関する記述として適切なのは？`,`「${t}」の目的に最も近いものは？`,`「${t}」の場面で確認すべき考え方は？`,`「${t}」で判断するときの基本は？`,`「${t}」の理解として正しいものは？`,`試験で「${t}」が問われたときの基本的な確認事項は？`,`「${t}」について最も基本的な説明は？`];return forms.map((q,i)=>({cat,topic:t,q,opts:sh([c,...sh(ds).slice(i%5,i%5+3)]),ans:c,ex:`ポイント：${c}。似た論点と混同しないため、まず「何を認識・測定・表示する論点か」を確認する。`}))}
function all(){let a=[];for(let c of Object.keys(topics))for(let t of topics[c])a.push(...make(c,t));return a}const ALL=all();
function home(){app.innerHTML=`<h1>📘 日商簿記1級 v17</h1><div class="card"><b>論点別10問</b><p class="small">56論点 × 10問 = 560問。選択肢は毎回シャッフル。</p></div><button class="primary" onclick="cats()">📚 論点から10問</button><button onclick="random(10)">⚡ とにかく10問</button><button onclick="random(50)">⚡ とにかく50問</button><button onclick="random(100)">⚡ とにかく100問</button><button onclick="status()">📊 学習状況</button>`}
function cats(){let s='<h2>科目を選ぶ</h2>';for(let c in topics)s+=`<button onclick="tp('${c}')">${c}（${topics[c].length}論点）</button>`;s+='<button onclick="home()">← 戻る</button>';app.innerHTML=s}
function tp(c){let s=`<h2>${c}</h2><p class="small">各論点10問</p>`;for(let t of topics[c])s+=`<button onclick="topic('${c}','${t}')">${t}　10問</button>`;s+='<button onclick="cats()">← 科目へ</button>';app.innerHTML=s}
function topic(c,t){pool=make(c,t);idx=0;score=0;mode='quiz';render()}
function random(n){pool=sh(ALL).slice(0,n);idx=0;score=0;mode='quiz';render()}
function render(){if(idx>=pool.length){app.innerHTML=`<h2>終了</h2><div class="card"><b>${score} / ${pool.length} 正解</b></div><button class="primary" onclick="home()">ホームへ</button>`;return}let q=pool[idx];answered=false;app.innerHTML=`<div class="small">${idx+1} / ${pool.length}　正解 ${score}</div><div class="card"><span class="tag">${q.cat}</span><span class="tag">${q.topic}</span><h2>${esc(q.q)}</h2></div>${q.opts.map((o,i)=>`<button class="choice" onclick="ans(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<button onclick="home()">中断してホームへ</button>`}
function ans(i){if(answered)return;answered=true;let q=pool[idx],cs=document.querySelectorAll('.choice');cs.forEach((b,k)=>{if(q.opts[k]===q.ans)b.classList.add('correct')});let ok=q.opts[i]===q.ans;if(ok)score++;else{cs[i].classList.add('wrong');let h=JSON.parse(localStorage.getItem(KEY)||'{}');h[q.topic]=(h[q.topic]||0)+1;localStorage.setItem(KEY,JSON.stringify(h))}let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${ok?'○ 正解':'× 不正解'}</b><p>${esc(q.ex)}</p>`;app.appendChild(d);let b=document.createElement('button');b.className='primary';b.textContent=idx+1===pool.length?'結果を見る':'次の問題';b.onclick=()=>{idx++;render()};app.appendChild(b)}
function status(){let h=JSON.parse(localStorage.getItem(KEY)||'{}'),r=Object.entries(h).sort((a,b)=>b[1]-a[1]);app.innerHTML='<h2>📊 学習状況</h2>'+(r.length?r.map(x=>`<div class="card">${x[0]}<br><b>ミス ${x[1]}回</b></div>`).join(''):'<div class="card">まだ記録がありません。</div>')+'<button onclick="home()">← ホーム</button>'}home();
</script></body></html>
