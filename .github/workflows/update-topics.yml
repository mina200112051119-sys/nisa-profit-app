# v10 fix hot-stock name matching and whitespace search
name: Update topic data
on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-topics.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Japanese market topics and hot stocks
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, xml.etree.ElementTree as ET, re, os
          from datetime import datetime, timezone
          from html import unescape
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=25).read()
          queries=['日本株 注目銘柄 今日','日本株 話題銘柄 今日','日本株 AI 半導体','日本株 防衛 インフラ','日本株 電力 データセンター','日本株 宇宙 レアアース']
          items=[]
          for q in queries:
              try:
                  root=ET.fromstring(get('https://news.google.com/rss/search?q='+urllib.parse.quote(q)+'&hl=ja&gl=JP&ceid=JP:ja'))
                  for it in root.findall('./channel/item')[:12]:
                      title=unescape((it.findtext('title') or '').strip()); link=(it.findtext('link') or '').strip(); pub=(it.findtext('pubDate') or '').strip(); source=it.findtext('source') or ''
                      if title and link: items.append({'title':title,'link':link,'pubDate':pub,'source':source})
              except Exception as e: print('feed error',q,e)
          hot={}
          try:
              html=get('https://www.nsjournal.jp/category/nsj_short_live/121-1/').decode('utf-8','ignore')
              text=unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html)))
              pat=r'([A-Za-z0-9一-龯ぁ-んァ-ヶー＆・.\s]{2,40}?)\((\d{3,4}[A-Z]?)・(?:東[PSG]|[PSG])\)'
              for m in re.finditer(pat,text):
                  name=re.sub(r'\s+','',m.group(1)).strip(' ・'); code=m.group(2)
                  if name and code and not name.startswith(('ＮＳＪ','Free')):
                      hot.setdefault(code,{'name':name,'symbol':code,'mentions':0,'reasons':[]})['mentions']+=1
          except Exception as e: print('NSJ error',e)
          for x in items:
              title=x['title']
              for m in re.finditer(r'([A-Za-z0-9一-龯ぁ-んァ-ヶー＆・.]{2,40})\s*[<(（](\d{3,4}[A-Z]?)[>）)・]',title):
                  name=m.group(1).strip(' ・'); code=m.group(2)
                  if name and code:
                      hot.setdefault(code,{'name':name,'symbol':code,'mentions':0,'reasons':[]})['mentions']+=1
                      hot[code]['reasons'].append(title[:100])
          signals=['注目','話題','急騰','ストップ高','上方修正','自社株買い','好材料','買い気配','高値','材料']
          for v in hot.values():
              v['signal_count']=sum(sum(w in r for w in signals) for r in v['reasons'])
              v['rank']=v['mentions']*3+v['signal_count']
          ranked=sorted(hot.values(),key=lambda x:(x['rank'],x['mentions']),reverse=True)[:30]
          max_rank=max([v['rank'] for v in ranked] or [1])
          dynamic=[]
          for idx,v in enumerate(ranked):
              confidence=round(55+40*(v['rank']/max_rank))
              dynamic.append({'name':v['name']+'（'+v['symbol']+'）','type':'個別株','theme':'本日の話題・ニュース','base':5,'down':-20,'up':20,'confidence':confidence,'symbol':v['symbol'],'rank':v['rank'],'reason':v['reasons'][0] if v['reasons'] else '本日の市場ニュースで掲載'})
          seen=set(); unique=[]
          for x in items:
              if x['title'] not in seen: seen.add(x['title']); unique.append(x)
          keywords={'AI':['AI','人工知能','生成AI'],'半導体':['半導体','メモリ','GPU'],'防衛':['防衛','ミサイル','安全保障'],'電力':['電力','原発','再生可能エネルギー'],'データセンター':['データセンター','データセンタ'],'宇宙':['宇宙','衛星','月面'],'レアアース':['レアアース','重要鉱物','海底資源'],'インフラ':['インフラ','建設','設備投資']}
          text=' '.join(x['title'] for x in unique).lower(); themes=[]
          for name,ks in keywords.items():
              count=sum(text.count(k.lower()) for k in ks)
              if count: themes.append({'name':name,'count':count})
          themes.sort(key=lambda x:x['count'],reverse=True)
          updated=datetime.now(timezone.utc).isoformat(); os.makedirs('data',exist_ok=True)
          with open('data/topic-update.json','w',encoding='utf-8') as f: json.dump({'updated_at':updated,'headlines':unique[:25],'themes':themes},f,ensure_ascii=False,indent=2)
          with open('data/hot-stocks.json','w',encoding='utf-8') as f: json.dump({'updated_at':updated,'stocks':dynamic},f,ensure_ascii=False,indent=2)
          print('dynamic hot stocks:',len(dynamic))
          PY
      - name: Patch app for confidence-ranked hot-stock search
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old_start='function searchProducts(){'
          old_end='function quickSearch(q){'
          a=s.find(old_start); b=s.find(old_end,a)
          if a>=0 and b>=0:
              new=r'''function searchProducts(){const raw=(document.getElementById('searchBox').value||'').trim(),q=raw.replace(/\s+/g,'').toLowerCase(),all=allProducts(),hotWords=['今話題のもの','今話題','話題のもの','話題'].map(x=>x.toLowerCase()),isHot=hotWords.includes(q),hits=(isHot?all.filter(x=>(x.theme||'').includes('本日の話題')):all.filter(x=>{const n=String(x.name).toLowerCase().replace(/\s+/g,''),t=String(x.theme||'').toLowerCase().replace(/\s+/g,''),k=String(x.type||'').toLowerCase().replace(/\s+/g,'');return !q||n.includes(q)||t.includes(q)||k.includes(q)})).sort((a,b)=>(Number(b.confidence)||0)-(Number(a.confidence)||0)||(Number(b.rank)||0)-(Number(a.rank)||0));document.getElementById('searchResult').innerHTML='<p class="small">'+hits.length+'件表示'+(isHot?'　※信用度の高い順':'　※「今話題」は自動更新')+'</p>'+hits.map(x=>'<div class="saved"><b>'+esc(x.name)+'</b><br><span class="tag">信用度 '+(Number(x.confidence)||0)+'%</span> <span class="tag">'+esc(x.theme||'')+'</span>'+(x.reason?'<div class="small">'+esc(x.reason)+'</div>':'')+'<button class="full" type="button" data-item="'+all.indexOf(x)+'">この商品を登録</button></div>').join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>registerItem(all[+b.dataset.item]))}
'''
              s=s[:a]+new+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add long-term resilience and offline fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker="async function fetchPrice(p){"
          helper="""async function fetchWithTimeout(url,ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{signal:c.signal,cache:'no-store'})}finally{clearTimeout(t)}}function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function cacheGet(k,fallback){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??fallback}catch(e){return fallback}}"""
          if helper not in s and marker in s: s=s.replace(marker,helper+marker)
          s=s.replace("const r=await fetch('https://api.twelvedata.com/price?symbol='+encodeURIComponent(p.symbol)+'&exchange=TSE&apikey='+encodeURIComponent(apiKey)),d=await r.json();", "const r=await fetchWithTimeout('https://api.twelvedata.com/price?symbol='+encodeURIComponent(p.symbol)+'&exchange=TSE&apikey='+encodeURIComponent(apiKey));if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();")
          old="""async function loadHotStocks(){try{const d=await fetch('data/hot-stocks.json?v='+Date.now()).then(r=>r.json());dynamicHot=Array.isArray(d.stocks)?d.stocks:[];searchProducts()}catch(e){dynamicHot=[];searchProducts()}}"""
          new="""async function loadHotStocks(){try{const r=await fetchWithTimeout('data/hot-stocks.json?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.stocks))throw new Error('invalid data');dynamicHot=d.stocks;cacheSet('nisaHotCache',d);searchProducts()}catch(e){const d=cacheGet('nisaHotCache',{stocks:[]});dynamicHot=Array.isArray(d.stocks)?d.stocks:[];searchProducts()}}"""
          if old in s:s=s.replace(old,new)
          old2="""function loadTopics(){fetch('data/topic-update.json?v='+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('topicUpdated').textContent=d.updated_at?'更新 '+new Date(d.updated_at).toLocaleString('ja-JP'):'更新情報なし';document.getElementById('topicThemes').innerHTML=(d.themes||[]).slice(0,6).map(x=>'<span class=\"tag\">'+esc(x.name)+' '+x.count+'</span>').join(' ');document.getElementById('topicHeadlines').innerHTML=(d.headlines||[]).slice(0,8).map(x=>'<div class=\"saved\"><a href=\"'+x.link+'\" target=\"_blank\" rel=\"noopener\">'+esc(x.title)+'</a><div class=\"small\">'+esc(x.source||'')+'</div></div>').join('')}).catch(()=>{})}"""
          new2="""function renderTopics(d){document.getElementById('topicUpdated').textContent=d.updated_at?'更新 '+new Date(d.updated_at).toLocaleString('ja-JP'):'更新情報なし';document.getElementById('topicThemes').innerHTML=(d.themes||[]).slice(0,6).map(x=>'<span class=\"tag\">'+esc(x.name)+' '+x.count+'</span>').join(' ');document.getElementById('topicHeadlines').innerHTML=(d.headlines||[]).slice(0,8).map(x=>'<div class=\"saved\"><a href=\"'+esc(x.link||'#')+'\" target=\"_blank\" rel=\"noopener\">'+esc(x.title)+'</a><div class=\"small\">'+esc(x.source||'')+'</div></div>').join('')}function loadTopics(){fetchWithTimeout('data/topic-update.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{cacheSet('nisaTopicCache',d);renderTopics(d)}).catch(()=>{const d=cacheGet('nisaTopicCache',null);if(d)renderTopics(d);else document.getElementById('topicUpdated').textContent='最新情報を取得できません。'})}"""
          if old2 in s:s=s.replace(old2,new2)
          s=s.replace("setInterval(updateAllPrices,30000);", "setInterval(updateAllPrices,300000);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate app data before commit
        run: |
          python - <<'PY'
          import json
          for path,key in [('data/topic-update.json','headlines'),('data/hot-stocks.json','stocks')]:
              with open(path,encoding='utf-8') as f:d=json.load(f)
              assert isinstance(d.get(key),list), path+' invalid'
          print('data validation OK')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/topic-update.json data/hot-stocks.json index.html
          git diff --cached --quiet || git commit -m 'fix: match hot stock names and search correctly'
          git push
