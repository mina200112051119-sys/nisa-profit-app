name: Update topic data
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timestamp
        run: |
          mkdir -p data
          printf '{"updated_at":"%s","note":"話題テーマの更新枠"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/topic-update.json
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/topic-update.json
          git diff --cached --quiet || git commit -m 'chore: update topic data timestamp'
          git push
