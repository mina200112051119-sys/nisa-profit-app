let S=JSON.parse(localStorage.getItem('bokiV14')||'{"wrong":{},"answered":{},"days":{}}'),pool=[],i=0,score=0;
function shuffle(a){a=[...a];for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function save(){localStorage.setItem('bokiV14',JSON.stringify(S))}function home(){app.innerHTML='<div class="card"><h2>選ぶ</h2><button class="main" onclick="categories()">📚 カテゴリー別に勉強</button><button onclick="random()">⚡ とにかく解く 10問</button><button onclick="journal()">✏️ 仕訳・仕訳理由</button><button onclick="status()">📊 学習状況・昨日の学習</button></div><div class="card small">※問題文は過去問の論点を参考にしたオリジナル問題。公式過去問の転載ではありません。</div>'}function categories(){let h='<div class="card"><h2>📚 1級の全分野</h2>';for(let c in cats)h+=`<button onclick="topics('${c}')">${c}<span class="small">　${cats[c].length}論点</span></button>`;h+='<button onclick="home()">← 戻る</button></div>';app.innerHTML=h}function topics(c){let h=`<div class="card"><h2>${c}</h2>`;cats[c].forEach(t=>{let n=qs.filter(q=>q[0]===c&&q[1]===t).length;h+=`<button onclick="topic('${c}','${t}')">${t}<span class="small">　登録${n}問</span></button>`});h+='<button onclick="categories()">← 戻る</button></div>';app.innerHTML=h}function topic(c,t){let a=qs.filter(q=>q[0]===c&&q[1]===t);if(!a.length){app.innerHTML=`<div class="card"><h2>${t}</h2><p>この論点はカテゴリーだけ先に登録しています。問題は追加中です。</p><button onclick="topics('${c}')">← 戻る</button></div>`;return}pool=shuffle(a).slice(0,10);start()}function random(){pool=shuffle(qs).slice(0,10);start()}function journal(){let a=qs.filter(q=>q[0]==='商業簿記');pool=shuffle(a).slice(0,10);start()}function start(){i=0;score=0;next()}function next(){if(i>=pool.length){app.innerHTML=`<div class="card"><h2>終了</h2><p>${score}/${pool.length}問正解</p><button class="main" onclick="home()">ホームへ</button></div>`;return}let q=pool[i],opts=shuffle(q[3].map((text,k)=>({text,k})));app.innerHTML=`<div class="card"><div class="small">${i+1}/${pool.length}　${q[0]} ＞ ${q[1]}</div><h2>${q[2]}</h2>${opts.map(o=>`<button onclick="answer(${o.k})">${o.text}</button>`).join('')}</div>`}function answer(k){let q=pool[i],ok=k===q[4];S.answered[q[1]]=(S.answered[q[1]]||0)+1;if(!ok)S.wrong[q[1]]=(S.wrong[q[1]]||0)+1;let d=new Date().toISOString().slice(0,10);S.days[d]=(S.days[d]||0)+1;save();app.innerHTML+=`<div class="card"><b>${ok?'⭕ 正解':'❌ 不正解'}</b><p>${q[5]}</p><button class="main" onclick="i++;${ok?'':'void 0'}next()">次へ →</button></div>`;document.querySelectorAll('button').forEach(b=>b.disabled=true)}function status(){let keys=Object.keys(S.wrong).sort((a,b)=>S.wrong[b]-S.wrong[a]),h='<div class="card"><h2>📊 学習状況</h2><p class="small">間違いが多い論点ほど上に表示</p>';if(!keys.length)h+='<p>まだ記録がありません。</p>';keys.forEach(k=>h+=`<p><b>${k}</b>：${S.wrong[k]}回</p>`);let d=new Date();d.setDate(d.getDate()-1);let y=d.toISOString().slice(0,10);h+=`<hr><p>昨日の学習：${S.days[y]||0}問</p><button onclick="home()">← 戻る</button></div>`;app.innerHTML=h}home();</script></body></html>
