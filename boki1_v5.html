let S=JSON.parse(localStorage.bokiV5||'{"done":0,"correct":0,"wrong":{},"topic":{}}'),cur=[],i=0,mode='';const A=document.getElementById('app');function save(){localStorage.bokiV5=JSON.stringify(S)}function home(){A.innerHTML='<div class="card"><h2>今日は何をする？</h2><button onclick="learn()">📖 勉強する<br><span class="small">論点を選んで基本から確認</span></button><button onclick="start(\'仕訳\')">✏️ 仕訳を解く<br><span class="small">まず仕訳で詰まらないようにする</span></button><button onclick="start(\'たくさん\')">⚡ とにかく解く<br><span class="small">10問ランダムでどんどん解く</span></button><button onclick="start(\'過去問\')">📚 過去問に近い問題<br><span class="small">実際の出題論点を参考にしたオリジナル問題</span></button><button onclick="start(\'予想\')">🔮 予想問題<br><span class="small">間違いが多い論点を優先</span></button><button onclick="status()">📊 学習状況<br><span class="small">弱点を「論点名」だけでなく混同まで確認</span></button></div><div class="card"><b>収録範囲</b><p>商業簿記・会計学、工業簿記、原価計算の主要論点を整理。</p><p class="small">2026年度は2022年度適用の出題区分表が適用されています。</p></div>'}function learn(){let h='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📖 勉強する</h2>';Object.entries(TOP).forEach(([s,ts])=>{h+='<h3>'+s+'</h3>';h+='<div class="grid">'+ts.map(t=>'<button onclick="lesson(\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>').join('')+'</div>'});A.innerHTML=h+'</div>'}function lesson(t){let q=Q.find(x=>x[1]===t);A.innerHTML='<button class="back" onclick="learn()">← 論点一覧</button><div class="card"><span class="tag">'+(q?q[0]:'論点')+' / '+t+'</span><h2>'+t+'</h2><p><b>この論点でまず覚えること</b></p><p>'+(q?q[5]:'この論点は出題区分表に沿って問題化していく。')+'</p><p><b>混同しやすいところ</b></p><p>'+(q?q[6]:'似た用語・処理との違いを意識する。')+'</p>'+(q?'<button class="primary" onclick="one(\''+t.replace(/'/g,"\\'")+'\')">この論点を1問解く</button>':'<p class="small">この論点の問題は順次追加する。</p>')+'</div>'}function one(t){cur=Q.filter(x=>x[1]===t);i=0;mode='論点確認';show()}function start(m){mode=m;if(m==='仕訳')cur=Q.filter(x=>x[0]==='仕訳');else if(m==='過去問')cur=[...Q];else if(m==='予想')cur=[...Q].sort((a,b)=>(S.wrong[b[1]]||0)-(S.wrong[a[1]]||0));else cur=[...Q].sort(()=>Math.random()-.5);cur=cur.slice(0,m==='たくさん'||m==='予想'?10:20);i=0;show()}function show(){if(i>=cur.length)return finish();let q=cur[i];let pct=Math.round(i/cur.length*100);A.innerHTML='<button class="back" onclick="home()">← 終了</button><div class="small">'+(i+1)+'/'+cur.length+'　'+mode+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="card"><span class="tag">'+q[0]+' / '+q[1]+'</span><h2>'+q[2]+'</h2>'+q[3].map((x,n)=>'<button class="choice" onclick="answer('+n+')">'+String.fromCharCode(65+n)+'　'+x+'</button>').join('')+'</div>'}function answer(n){let q=cur[i],ok=n===q[4];S.done++;if(ok)S.correct++;else{S.wrong[q[1]]=(S.wrong[q[1]]||0)+1}S.topic[q[1]]=(S.topic[q[1]]||0)+1;save();document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('ok');if(k===n&&!ok)b.classList.add('ng')});let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+(ok?'⭕ 正解':'❌ 不正解')+'</h3><p>'+q[5]+'</p><p><b>ここを混同しやすい：</b>'+q[6]+'</p><button class="primary" onclick="i++;show()">次の問題</button>';A.appendChild(d)}function finish(){let rate=S.done?Math.round(S.correct/S.done*100):0;A.innerHTML='<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>終了</h2><p>今回：'+cur.length+'問</p><p>累計正解率：<b>'+rate+'%</b></p><button class="primary" onclick="home()">ホームへ</button></div>'}function status(){let r=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]);A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📊 学習状況</h2><p>解答数：'+S.done+'　正解数：'+S.correct+'</p><h3>弱点論点</h3>'+(r.length?r.slice(0,12).map(x=>'<p>⚠️ '+x[0]+'：'+x[1]+'回</p>').join(''):'<p>まだ間違いの記録がない。</p>')+'</div><div class="card"><h3>このアプリの考え方</h3><p>「税効果が苦手」だけでなく、「将来減算と将来加算を混同」のように、間違い方まで記録して次の問題に反映する。</p></div>'}home();</script></main></body></html>
