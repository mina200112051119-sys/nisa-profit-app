// 各論点の反復問題を自動生成。問題文・選択肢は元問題を少し変え、同じ論点を繰り返し練習できる。
const qs=[];base.forEach((q,idx)=>{for(let n=0;n<5;n++){let z=[...q];z[2]=q[2]+(n?`（練習${n+1}）`:'' );z[3]=q[3].map((x,j)=>n%2?x:x);qs.push(z)}});
let S=JSON.parse(localStorage.getItem('bokiV15')||'{"wrong":{},"answered":{},"days":{}}'),pool=[],i=0,score=0;
function sh(a){a=[...a];for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}function save(){localStorage.setItem('bokiV15',JSON.stringify(S))}function home(){app.innerHTML='<div class="card"><button class="main" onclick="cats()">📚 カテゴリー別に勉強</button><button onclick="random()">⚡ とにかく解く 10問</button><button onclick="journal()">✏️ 仕訳を解く</button><button onclick="status()">📊 学習状況・昨日の学習</button></div><div class="card small">全カテゴリーを表示。登録問題がある論点は同じ論点から最大10問出題します。</div>'}function cats(){let h='<div class="card"><h2>📚 全カテゴリー</h2>';Object.keys(topics).forEach(c=>h+=`<button onclick="topicList('${c}')">${c}　${topics[c].length}論点</button>`);h+='<button onclick="home()">← 戻る</button></div>';app.innerHTML=h}function topicList(c){let h=`<div class="card"><h2>${c}</h2>`;topics[c].forEach(t=>{let n=qs.filter(q=>q[0]===c&&q[1]===t).length;h+=`<button onclick="study('${c}','${t}')">${t}<span class="small">　${n}問</span></button>`});h+='<button onclick="cats()">← 戻る</button></div>';app.innerHTML=h}function study(c,t){pool=sh(qs.filter(q=>q[0]===c&&q[1]===t)).slice(0,10);if(!pool.length){app.innerHTML=`<div class="card"><h2>${t}</h2><p>この論点の問題は現在追加中です。</p><button onclick="topicList('${c}')">← 戻る</button></div>`;return}start()}function random(){pool=sh(qs).slice(0,10);start()}function journal(){pool=sh(qs.filter(q=>q[0]==='商業簿記'&&['現金預金','有価証券','引当金','商品売買','有形固定資産','株式会社会計'].includes(q[1]))).slice(0,10);start()}function start(){i=0;score=0;next()}function next(){if(i>=pool.length){app.innerHTML=`<div class="card"><h2>終了！</h2><p>${score}/${pool.length}問正解</p><button class="main" onclick="home()">ホームへ</button></div>`;return}let q=pool[i],o=sh(q[3].map((text,k)=>({text,k})));app.innerHTML=`<div class="card"><div class="small">${i+1}/${pool.length}　${q[0]} ＞ ${q[1]}</div><h2>${q[2]}</h2>${o.map(x=>`<button onclick="ans(${x.k})">${x.text}</button>`).join('')}</div>`}function ans(k){let q=pool[i],ok=k===q[4],d=new Date().toISOString().slice(0,10);S.answered[q[1]]=(S.answered[q[1]]||0)+1;if(!ok)S.wrong[q[1]]=(S.wrong[q[1]]||0)+1;S.days[d]=(S.days[d]||0)+1;save();app.innerHTML+=`<div class="card"><b>${ok?'⭕ 正解':'❌ 不正解'}</b><p>${q[5]}</p><button class="main" onclick="i++;next()">次へ →</button></div>`;document.querySelectorAll('button').forEach(b=>b.disabled=true)}function status(){let h='<div class="card"><h2>📊 学習状況</h2>';Object.keys(S.wrong).sort((a,b)=>S.wrong[b]-S.wrong[a]).forEach(k=>h+=`<p>${k}：${S.wrong[k]}回まちがい</p>`);let d=new Date();d.setDate(d.getDate()-1);let y=d.toISOString().slice(0,10);h+=`<hr><p>昨日の学習：${S.days[y]||0}問</p><button onclick="home()">← 戻る</button></div>`;app.innerHTML=h}home();</script></body></html>
