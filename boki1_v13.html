<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簿記1級 学習ツール v13</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left}button.main{background:#222;color:#fff}.muted{color:#666;font-size:13px}.ok{background:#e8f5e9!important}.ng{background:#ffebee!important}.pill{display:inline-block;background:#eee;border-radius:20px;padding:5px 9px;margin:3px;font-size:13px}.entry{font-family:ui-monospace,monospace;background:#f1f3f5;padding:12px;border-radius:10px;white-space:pre-wrap}</style></head><body><div class="wrap"><h1>📘 簿記1級 学習ツール v13</h1><div id="app"></div></div><script>
const cats={商業簿記:['現金預金','有価証券','引当金','収益認識','税金・税効果','固定資産','減損','リース','外貨建取引','連結会計'],会計学:['キャッシュ・フロー','株主資本等変動計算書'],工業簿記:['材料費','労務費','製造間接費','標準原価計算','総合原価計算'],原価計算:['CVP分析','直接原価計算','意思決定']};
const qs=[
['商業簿記','現金預金','j','当座預金から普通預金へ10,000円振り替えた。正しい仕訳は？',['普通預金10,000／当座預金10,000','当座預金10,000／普通預金10,000','現金10,000／普通預金10,000','普通預金10,000／現金10,000'],0,'普通預金が増え、当座預金が減る。'],
['商業簿記','現金預金','j','現金20,000円を当座預金へ預け入れた。正しい仕訳は？',['当座預金20,000／現金20,000','現金20,000／当座預金20,000','普通預金20,000／現金20,000','当座預金20,000／売上20,000'],0,'当座預金の増加と現金の減少。'],
['商業簿記','有価証券','j','売買目的有価証券30,000円を現金で取得した。正しい仕訳は？',['売買目的有価証券30,000／現金30,000','現金30,000／売買目的有価証券30,000','有価証券30,000／売上30,000','投資有価証券30,000／現金30,000'],0,'有価証券が増え、現金が減る。'],
['商業簿記','引当金','j','貸倒れを見積もり、貸倒引当金5,000円を設定した。正しい仕訳は？',['貸倒引当金繰入5,000／貸倒引当金5,000','貸倒引当金5,000／貸倒引当金繰入5,000','売掛金5,000／貸倒引当金5,000','貸倒損失5,000／現金5,000'],0,'費用を計上し、貸倒引当金を設定する。'],
['商業簿記','収益認識','c','収益認識で原則として収益を認識する基礎は？',['履行義務を充足したとき','契約書を作成したとき','代金を受け取ったときだけ','商品を仕入れたとき'],0,'履行義務の充足を基礎に収益を認識する。'],
['商業簿記','税金・税効果','c','将来減算一時差異から生じる税効果は？',['繰延税金資産','繰延税金負債','売上高','資本金'],0,'将来の課税所得を減らす効果なので資産。'],
['商業簿記','固定資産','j','備品100,000円を現金で購入した。正しい仕訳は？',['備品100,000／現金100,000','現金100,000／備品100,000','備品100,000／売上100,000','消耗品費100,000／現金100,000'],0,'備品が増え、現金が減る。'],
['商業簿記','減損','c','固定資産の帳簿価額が回収可能価額を上回る場合、原則として？',['減損損失を認識する','売上を計上する','資本金を増やす','何もしない'],0,'帳簿価額を回収可能価額まで減額する。'],
['商業簿記','連結会計','c','親会社が子会社を支配している場合、連結財務諸表では？',['子会社を連結する','子会社を除外する','子会社の売上だけ連結する','親会社の資産だけ表示する'],0,'支配している子会社を連結の範囲に含める。'],
['商業簿記','連結会計','j','親会社の売掛金と子会社の買掛金を連結上消去する。正しい仕訳は？',['買掛金／売掛金','売掛金／買掛金','売上／売掛金','現金／買掛金'],0,'グループ内の債権・債務を相殺消去する。'],
['商業簿記','外貨建取引','c','外貨建金銭債権は決算時に原則として？',['決算日の為替相場で換算する','取得日の為替相場で固定する','必ず無視する','売上高に振り替える'],0,'決算時の為替相場で換算する。'],
['商業簿記','リース','c','リース取引で使用権を表す資産を認識する考え方は？',['使用権を資産として認識する','必ず全額費用にする','売上として認識する','資本金にする'],0,'借手が使用する権利を資産として認識する。'],
['工業簿記','材料費','c','材料価格差異は主に何の差による？',['標準価格と実際価格','標準数量と実際数量','標準賃率と実際賃率','固定費と変動費'],0,'価格の差による差異。'],
['工業簿記','労務費','c','賃率差異は主に何の差による？',['標準賃率と実際賃率','標準時間と実際時間','標準価格と実際価格','予算と売上'],0,'賃率の違いによる差異。'],
['工業簿記','製造間接費','c','製造間接費の予算差異を考える基本は？',['予算許容額と実際発生額','売上高と営業利益','標準価格と実際価格','期首在庫と期末在庫'],0,'予算と実際発生額を比較する。'],
['工業簿記','標準原価計算','c','標準原価計算の重要な目的は？',['原価管理と差異分析','現金管理だけ','株価予測だけ','税金申告だけ'],0,'標準と実際を比較して原価管理に役立てる。'],
['工業簿記','総合原価計算','c','平均法の基本的な考え方は？',['期首仕掛品と当期投入を合わせて平均単価を求める','当期投入だけで単価を求める','期末仕掛品だけで単価を求める','売上高だけで単価を求める'],0,'期首と当期を合わせて平均的な単価を求める。'],
['原価計算','CVP分析','c','損益分岐点売上高の基本式は？',['固定費÷限界利益率','固定費×限界利益率','売上高÷固定費','変動費÷固定費'],0,'限界利益が固定費と等しくなる売上高。'],
['原価計算','直接原価計算','c','直接原価計算では固定製造原価をどう扱う？',['期間費用とする','製品原価に全額含める','売上として扱う','資本金にする'],0,'固定製造原価を期間費用として扱う。'],
['原価計算','意思決定','c','追加注文を受けるかの意思決定で重視するのは？',['意思決定によって増減する関連原価','すでに発生した埋没原価','過去の購入価格だけ','会社全体の総資産だけ'],0,'将来増減する関連原価を比較する。'],
['会計学','キャッシュ・フロー','c','借入金の返済による支出は通常どの区分？',['財務活動によるCF','営業活動によるCF','投資活動によるCF','非資金取引'],0,'借入・返済は財務活動によるCF。'],
['会計学','株主資本等変動計算書','c','配当による利益剰余金の減少は？',['株主資本の変動','売上高の増加','営業外収益','固定資産の増加'],0,'配当は利益剰余金を減少させる。']];
let S=JSON.parse(localStorage.getItem('bokiV13')||'{"wrong":{},"days":{}}'),pool=[],pos=0,score=0,mode='study';
function save(){localStorage.setItem('bokiV13',JSON.stringify(S))}function td(){return new Date().toISOString().slice(0,10)}function home(){app.innerHTML='<div class="card"><h2>やりたいこと</h2><button class="main" onclick="categories()">📚 カテゴリー別に勉強</button><button onclick="startRandom()">⚡ とにかく解く 10問</button><button onclick="startType(\'j\')">✏️ 仕訳を解く</button><button onclick="startType(\'why\')">🧠 なぜこの仕訳？</button><button onclick="startType(\'conf\')">🔀 似た仕訳を見分ける</button><button onclick="prediction()">🔮 予想問題</button><button onclick="status()">📊 学習状況</button></div>'}function categories(){let h='<div class="card"><h2>カテゴリー</h2>';Object.keys(cats).forEach(c=>h+=`<button onclick="topics('${c}')">${c}</button>`);h+='<button onclick="home()">← 戻る</button></div>';app.innerHTML=h}function topics(c){let h=`<div class="card"><h2>${c}</h2>`;cats[c].forEach(t=>h+=`<button onclick="setup('${c}','${t}')">${t}</button>`);h+='<button onclick="categories()">← 戻る</button></div>';app.innerHTML=h}function setup(c,t){let n=qs.filter(q=>q[0]===c&&q[1]===t).length;app.innerHTML=`<div class="card"><h2>${c} ＞ ${t}</h2><p>この論点：${n}問</p><button class="main" onclick="runTopic('${c}','${t}')">📖 勉強する 10問</button><button onclick="topics('${c}')">← 戻る</button></div>`}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function runTopic(c,t){let a=qs.filter(q=>q[0]===c&&q[1]===t),b=qs.filter(q=>q[0]===c&&!a.includes(q));pool=shuffle([...a,...b]);if(!pool.length)pool=shuffle([...qs]);pool=pool.slice(0,10);start('study')}function startRandom(){pool=shuffle([...qs]).slice(0,10);start('study')}function startType(k){mode=k;pool=shuffle(qs.filter(q=>k==='j'?q[2]==='j':q[2]==='j'));if(!pool.length)pool=shuffle([...qs]);pool=pool.slice(0,10);pos=0;score=0;show()}function prediction(){let a=[...qs].sort((x,y)=>(S.wrong[y[1]]||0)-(S.wrong[x[1]]||0));pool=shuffle(a.slice(0,Math.min(10,a.length)));start('prediction')}function start(m){mode=m;pos=0;score=0;show()}function show(){if(pos>=pool.length)return result();let q=pool[pos],items=q[4].map((text,i)=>({text,i}));shuffle(items);let h=`<div class="card"><p class="muted">${pos+1} / ${pool.length}　${q[0]} ＞ ${q[1]}</p><h2>${q[3]}</h2>`;items.forEach((x,i)=>h+=`<button onclick="answer(${x.i},this)">${i+1}. ${x.text}</button>`);h+='<button onclick="home()">中断して戻る</button></div>';app.innerHTML=h}function answer(i,btn){let q=pool[pos],ok=i===q[5];document.querySelectorAll('button').forEach(b=>b.disabled=true);btn.classList.add(ok?'ok':'ng');if(ok)score++;else S.wrong[q[1]]=(S.wrong[q[1]]||0)+1;let d=td();S.days[d]=(S.days[d]||0)+(ok?0:1);save();app.innerHTML+=`<div class="card"><b>${ok?'⭕ 正解':'❌ 不正解'}</b><p>${q[6]}</p>${!ok?'<p class="muted">混同しやすい点：正解の根拠を確認しよう。</p>':''}<button class="main" onclick="pos++;show()">次へ</button></div>`}function result(){app.innerHTML=`<div class="card"><h2>終了</h2><p>${pool.length}問中 ${score}問正解</p><button class="main" onclick="home()">ホームへ</button></div>`}function status(){let d=td(),y=new Date(Date.now()-86400000).toISOString().slice(0,10);let h='<div class="card"><h2>📊 学習状況</h2><p>今日の不正解：'+(S.days[d]||0)+'問</p><p>昨日の不正解：'+(S.days[y]||0)+'問</p><h3>論点別の不正解</h3>';Object.keys(S.wrong).sort((a,b)=>S.wrong[b]-S.wrong[a]).forEach(k=>h+=`<span class="pill">${k}：${S.wrong[k]}問</span>`);h+='<button onclick="home()">← 戻る</button></div>';app.innerHTML=h}home();
</script></body></html>
