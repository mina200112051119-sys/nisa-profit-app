let S=JSON.parse(localStorage.bokiV6||'{"done":0,"correct":0,"wrong":{},"confuse":{}}'),cur=[],idx=0,mode='';const A=document.getElementById('app');
function save(){localStorage.bokiV6=JSON.stringify(S)}function home(){A.innerHTML='<div class="card"><h2>今日は何をする？</h2><div class="grid"><button onclick="learn()">📖 勉強する</button><button onclick="rapid()">⚡ とにかく解く</button><button onclick="start(\'仕訳\')">✏️ 仕訳</button><button onclick="start(\'過去問\')">📚 類題</button><button onclick="predict()">🔮 予想</button><button onclick="status()">📊 学習状況</button></div></div><div class="card"><b>問題数：'+Q.length+'問</b><p class="small">2026年度の公式出題区分を土台にしたオリジナル問題。公式過去問の文章は転載していません。</p></div>'}function learn(){let subs=[...new Set(Q.map(q=>q[0]))];A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📖 論点から勉強</h2>'+subs.map(s=>'<h3>'+s+'</h3>'+[...new Set(Q.filter(q=>q[0]===s).map(q=>q[1]))].map(t=>'<button onclick="lesson(\''+t+'\')">'+t+'</button>').join('')).join('')+'</div>'}function lesson(t){let q=Q.find(x=>x[1]===t);A.innerHTML='<button class="back" onclick="learn()">← 戻る</button><div class="card"><span class="tag">'+q[0]+' / '+t+'</span><h2>'+t+'</h2><p><b>まず覚える</b></p><p>'+q[5]+'</p><p><b>混同しやすい点</b></p><p>'+q[6]+'</p><button class="primary" onclick="one(\''+t+'\')">確認問題を解く</button></div>'}function one(t){cur=Q.filter(q=>q[1]===t);idx=0;mode='論点確認';show()}function rapid(){let n=prompt('何問解く？ 10 / 50 / 100','10');n=parseInt(n)||10;cur=[...Q].sort(()=>Math.random()-.5).slice(0,Math.min(n,Q.length));idx=0;mode='とにかく解く';show()}function start(m){mode=m;let pool=m==='仕訳'?Q.filter(q=>q[0]==='商会'&&['現金預金','有価証券','債権','手形','収益認識','固定資産','無形固定資産','減損','リース','外貨建取引','資産除去債務','税金','決算','会計上の変更'].includes(q[1])):Q;cur=[...pool].sort(()=>Math.random()-.5).slice(0,10);idx=0;show()}function predict(){let ranked=[...Q].sort((a,b)=>(S.wrong[b[1]]||0)-(S.wrong[a[1]]||0));cur=ranked.slice(0,Math.min(10,Q.length));idx=0;mode='予想';show()}function show(){if(idx>=cur.length)return finish();let q=cur[idx];A.innerHTML='<button class="back" onclick="home()">← 終了</button><div class="small">'+(idx+1)+' / '+cur.length+'　'+mode+'</div><div class="card"><span class="tag">'+q[0]+' / '+q[1]+'</span><h2>'+q[2]+'</h2>'+q[3].map((x,n)=>'<button class="choice" onclick="answer('+n+')">'+String.fromCharCode(65+n)+'　'+x+'</button>').join('')+'</div>'}function answer(n){let q=cur[idx],ok=n===q[4];S.done++;if(ok)S.correct++;else{S.wrong[q[1]]=(S.wrong[q[1]]||0)+1;S.confuse[q[6]]=(S.confuse[q[6]]||0)+1}save();document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('ok');if(k===n&&!ok)b.classList.add('ng')});let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+(ok?'⭕ 正解':'❌ 不正解')+'</h3><p>'+q[5]+'</p><p><b>混同ポイント：</b>'+q[6]+'</p><button class="primary" onclick="idx++;show()">次へ</button>';A.appendChild(d)}function finish(){let rate=S.done?Math.round(S.correct/S.done*100):0;A.innerHTML='<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>終了</h2><p>今回の問題：'+cur.length+'問</p><p>累計正解率：<b>'+rate+'%</b></p><button class="primary" onclick="home()">ホームへ</button></div>'}function status(){let w=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]);let c=Object.entries(S.confuse).sort((a,b)=>b[1]-a[1]);A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📊 学習状況</h2><p>解答数：'+S.done+'　正解数：'+S.correct+'</p><h3>弱点論点</h3>'+(w.length?w.slice(0,10).map(x=>'<p>'+x[0]+'：'+x[1]+'回</p>').join(''):'<p>まだ記録なし</p>')+'<h3>混同しやすいポイント</h3>'+(c.length?c.slice(0,8).map(x=>'<p>'+x[0]+'：'+x[1]+'回</p>').join(''):'<p>まだ記録なし</p>')+'</div>'}home();</script></main></body></html>
