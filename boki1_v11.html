<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簿記1級 学習ツール v11</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left}button.main{background:#222;color:#fff}.muted{color:#666;font-size:13px}.ok{background:#e8f5e9!important}.ng{background:#ffebee!important}.entry{font-family:ui-monospace,monospace;background:#f1f3f5;padding:12px;border-radius:10px;white-space:pre-wrap}.pill{display:inline-block;background:#eee;border-radius:20px;padding:5px 9px;margin:3px;font-size:13px}.back{background:#ddd}</style></head><body><div class="wrap"><h1>📘 簿記1級 学習ツール</h1><div id="app"></div></div><script>
const cats={商業簿記:['現金預金','有価証券','債権・債務','手形','引当金','商品売買','収益認識','金融商品','固定資産','減損','リース','外貨建取引','資産除去債務','税金・税効果','株式会社会計','本支店会計','連結会計'],会計学:['会計原則・基準','財務諸表','キャッシュ・フロー','株主資本等変動計算書','概念フレームワーク','企業結合・事業分離','連結・包括利益'],工業簿記:['原価の基礎','材料費','労務費','経費','製造間接費','部門費','個別原価計算','総合原価計算','標準原価計算','直接原価計算','工場会計'],原価計算:['CVP分析','原価予測','差額原価収益分析','意思決定','予算管理','戦略的原価計算','営業費計算']};
const qs=[
{id:1,c:'商業簿記',t:'現金預金',type:'j',p:'当座預金から普通預金へ10,000円振り替えた。正しい仕訳は？',o:['普通預金10,000／当座預金10,000','当座預金10,000／普通預金10,000','現金10,000／普通預金10,000','普通預金10,000／現金10,000'],a:0,e:'預金科目間の振替なので、普通預金が増え、当座預金が減る。'},
{id:2,c:'商業簿記',t:'現金預金',type:'j',p:'現金20,000円を当座預金へ預け入れた。正しい仕訳は？',o:['当座預金20,000／現金20,000','現金20,000／当座預金20,000','普通預金20,000／現金20,000','当座預金20,000／売上20,000'],a:0,e:'現金を当座預金へ移すため、当座預金が増加し現金が減少する。'},
{id:3,c:'商業簿記',t:'有価証券',type:'j',p:'売買目的有価証券30,000円を現金で取得した。正しい仕訳は？',o:['有価証券30,000／現金30,000','現金30,000／有価証券30,000','有価証券30,000／売上30,000','投資有価証券30,000／現金30,000'],a:0,e:'売買目的で保有する有価証券を資産計上する。'},
{id:4,c:'商業簿記',t:'引当金',type:'j',p:'貸倒れを見積もり、貸倒引当金5,000円を設定した。正しい仕訳は？',o:['貸倒引当金繰入5,000／貸倒引当金5,000','貸倒引当金5,000／貸倒引当金繰入5,000','売掛金5,000／貸倒引当金5,000','貸倒損失5,000／現金5,000'],a:0,e:'将来の貸倒れに備える費用を計上し、貸倒引当金を設定する。'},
{id:5,c:'商業簿記',t:'収益認識',type:'c',p:'収益認識で、原則として収益を認識する基礎となる考え方は？',o:['履行義務を充足したとき','契約書を作成したとき','代金を受け取ったときだけ','商品を仕入れたとき'],a:0,e:'履行義務を充足した時点を基礎として収益を認識する。'},
{id:6,c:'商業簿記',t:'税金・税効果',type:'c',p:'将来減算一時差異から生じる税効果は？',o:['繰延税金資産','繰延税金負債','売上高','資本金'],a:0,e:'将来の課税所得を減らす効果があるため、繰延税金資産となる。'},
{id:7,c:'商業簿記',t:'固定資産',type:'j',p:'備品100,000円を現金で購入した。正しい仕訳は？',o:['備品100,000／現金100,000','現金100,000／備品100,000','備品100,000／売上100,000','消耗品費100,000／現金100,000'],a:0,e:'使用期間が長い備品は固定資産として計上する。'},
{id:8,c:'商業簿記',t:'減損',type:'c',p:'固定資産の帳簿価額が回収可能価額を上回る場合、原則として？',o:['減損損失を認識する','売上を計上する','資本金を増やす','何もしない'],a:0,e:'回収可能価額まで帳簿価額を減額し、減損損失を認識する。'},
{id:9,c:'商業簿記',t:'連結会計',type:'c',p:'親会社が子会社を支配している場合、連結財務諸表では？',o:['子会社を連結する','子会社を必ず除外する','子会社の売上だけ連結する','親会社の資産だけ表示する'],a:0,e:'支配している子会社を連結の範囲に含める。'},
{id:10,c:'商業簿記',t:'連結会計',type:'j',p:'連結上、親会社の売掛金と子会社の買掛金を消去する。正しい仕訳は？',o:['買掛金／売掛金','売掛金／買掛金','売上／売掛金','現金／買掛金'],a:0,e:'グループ内の債権・債務は連結財務諸表では相殺消去する。'},
{id:11,c:'工業簿記',t:'材料費',type:'c',p:'材料価格差異は、主に何の差による？',o:['標準価格と実際価格','標準数量と実際数量','標準賃率と実際賃率','固定費と変動費'],a:0,e:'価格の差による差異なので、標準価格と実際価格を比較する。'},
{id:12,c:'工業簿記',t:'労務費',type:'c',p:'賃率差異は、主に何の差による？',o:['標準賃率と実際賃率','標準時間と実際時間','標準価格と実際価格','予算と売上'],a:0,e:'賃率の違いによって生じる差異。'},
{id:13,c:'工業簿記',t:'製造間接費',type:'c',p:'製造間接費の予算差異を考えるとき、基本的に比較するのは？',o:['予算許容額と実際発生額','売上高と営業利益','標準価格と実際価格','期首在庫と期末在庫'],a:0,e:'予算と実際発生額を比較して差異を分析する。'},
{id:14,c:'工業簿記',t:'標準原価計算',type:'c',p:'標準原価計算の重要な目的は？',o:['原価管理と差異分析','現金管理だけ','株価予測だけ','税金の申告だけ'],a:0,e:'標準と実際を比較し、差異分析を原価管理に役立てる。'},
{id:15,c:'工業簿記',t:'総合原価計算',type:'c',p:'平均法の基本的な考え方は？',o:['期首仕掛品と当期投入を合わせて平均単価を求める','当期投入だけで単価を求める','期末仕掛品だけで単価を求める','売上高だけで単価を求める'],a:0,e:'期首仕掛品原価と当期投入原価を合わせ、平均的な単価を計算する。'},
{id:16,c:'原価計算',t:'CVP分析',type:'c',p:'損益分岐点売上高を求める基本式は？',o:['固定費÷限界利益率','固定費×限界利益率','売上高÷固定費','変動費÷固定費'],a:0,e:'損益分岐点では限界利益＝固定費となる。'},
{id:17,c:'原価計算',t:'直接原価計算',type:'c',p:'直接原価計算では固定製造原価をどう扱う？',o:['期間費用とする','製品原価に全額含める','売上として扱う','資本金にする'],a:0,e:'固定製造原価は期間費用として扱い、変動製造原価を製品原価とする。'},
{id:18,c:'原価計算',t:'意思決定',type:'c',p:'追加注文を受けるかの意思決定で重視するのは？',o:['意思決定によって増減する関連原価','すでに発生した埋没原価','過去の購入価格だけ','会社全体の総資産だけ'],a:0,e:'意思決定によって将来増減する関連原価を比較する。'},
{id:19,c:'会計学',t:'キャッシュ・フロー',type:'c',p:'借入金の返済による支出は通常どの区分？',o:['財務活動によるCF','営業活動によるCF','投資活動によるCF','非資金取引'],a:0,e:'借入・返済は資金調達に関するため財務活動によるキャッシュ・フロー。'},
{id:20,c:'会計学',t:'株主資本等変動計算書',type:'c',p:'配当による利益剰余金の減少は？',o:['株主資本の変動','売上高の増加','営業外収益','固定資産の増加'],a:0,e:'株主への配当は利益剰余金を減少させる株主資本の変動。'}];
let S=JSON.parse(localStorage.getItem('bokiV11')||'{"wrong":{},"days":{},"conf":{}}'),pool=[],pos=0,score=0,mode='study';
function save(){localStorage.setItem('bokiV11',JSON.stringify(S))}function day(d=0){let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function home(){app.innerHTML='<div class="card"><h2>やりたいこと</h2><button class="main" onclick="categories()">📚 カテゴリー別に勉強</button><button onclick="random10()">⚡ とにかく解く 10問</button><button onclick="selectMode(\'j\')">✏️ 仕訳を解く</button><button onclick="selectMode(\'why\')">🧠 なぜこの仕訳？</button><button onclick="selectMode(\'conf\')">🔀 似た仕訳を見分ける</button><button onclick="prediction()">🔮 予想問題</button><button onclick="status()">📊 学習状況・昨日の学習</button></div><div class="card">今日：'+(S.days[day()]?.done||0)+'問　正解：'+(S.days[day()]?.ok||0)+'問</div>'}
function categories(){let h='<div class="card"><h2>カテゴリー</h2>';Object.keys(cats).forEach(c=>h+='<button onclick="topics(\''+c+'\')">'+c+'</button>');h+='<button class="back" onclick="home()">← 戻る</button></div>';app.innerHTML=h}
function topics(c){let h='<div class="card"><h2>'+c+'</h2><p class="muted">分野を選んで、問題数と勉強方法を決めます。</p>';cats[c].forEach(t=>h+='<button onclick="setup(\''+c+'\',\''+t+'\')">'+t+'</button>');h+='<button class="back" onclick="categories()">← カテゴリーへ</button></div>';app.innerHTML=h}
function setup(c,t){let n=qs.filter(q=>q.c===c&&q.t===t).length;app.innerHTML='<div class="card"><h2>'+c+' ＞ '+t+'</h2><p>この論点の登録問題：'+n+'問</p><p>何問やる？</p><button onclick="run(\''+c+'\',\''+t+'\',\'study\',5)">📖 勉強 5問</button><button onclick="run(\''+c+'\',\''+t+'\',\'study\',10)">📖 勉強 10問</button><button onclick="run(\''+c+'\',\''+t+'\',\'j\',10)">✏️ 仕訳 10問</button><button onclick="run(\''+c+'\',\''+t+'\',\'why\',10)">🧠 なぜ？ 10問</button><button onclick="run(\''+c+'\',\''+t+'\',\'conf\',10)">🔀 似た仕訳 10問</button><p class="muted">論点の問題が10問未満なら、同カテゴリーの他論点を補充して10問にします。</p><button class="back" onclick="topics(\''+c+'\')">← 戻る</button></div>'}
function make(base,n){let a=qs.filter(base),c=a[0]?.c;if(a.length<n&&c)a=a.concat(qs.filter(q=>q.c===c&&!a.includes(q)));return a.sort(()=>Math.random()-.5).slice(0,Math.min(n,a.length))}
function run(c,t,m,n){mode=m;pool=make(q=>q.c===c&&q.t===t,n);pos=0;score=0;show()}
function random10(){mode='study';pool=qs.slice().sort(()=>Math.random()-.5).slice(0,10);pos=0;score=0;show()}
function selectMode(m){mode=m;let base=qs.filter(q=>q.type==='j');pool=base.sort(()=>Math.random()-.5).slice(0,10);pos=0;score=0;show()}
function prediction(){mode='study';pool=qs.slice().sort((a,b)=>(S.wrong[b.t]||0)-(S.wrong[a.t]||0)).slice(0,10);pos=0;score=0;show()}
function show(){if(pos>=pool.length)return finish();let q=pool[pos],opts=q.o, title=q.p; if(mode==='why'){title='この仕訳になる「理由」はどれ？\n'+q.o[q.a];opts=['資産が増えて、相手科目が減る取引だから','費用と収益を同時に計上する取引だから','必ず現金が増える取引だから','必ず負債が増える取引だから'];} if(mode==='conf'){title='この仕訳を判断するとき、まず何を見る？\n'+q.o[q.a];opts=['借方・貸方それぞれの勘定科目の増減','会社の利益率だけ','前年度の売上高だけ','現金残高だけ'];} let h='<div class="card"><span class="pill">'+q.c+'</span><span class="pill">'+q.t+'</span><p>'+ (pos+1)+' / '+pool.length+'</p><h3>'+title.replace(/\n/g,'<br>')+'</h3>';if(mode==='j'||(mode==='study'&&q.type==='j'))h+='<p class="muted">正しい仕訳を1つ選んでください。</p>';opts.forEach((o,i)=>h+='<button onclick="answer('+i+')">'+String.fromCharCode(65+i)+'．'+o+'</button>');h+='<div id="res"></div></div>';app.innerHTML=h}
function answer(i){let q=pool[pos],correct=q.a;if(mode==='why'||mode==='conf')correct=0;let ok=i===correct,d=S.days[day()]||{done:0,ok:0,topics:{}};d.done++;if(ok){score++;d.ok++}d.topics=d.topics||{};d.topics[q.t]=(d.topics[q.t]||0)+1;S.days[day()]=d;if(!ok)S.wrong[q.t]=(S.wrong[q.t]||0)+1;save();document.getElementById('res').innerHTML='<div class="card '+(ok?'ok':'ng')+'"><b>'+(ok?'○ 正解':'× 不正解')+'</b><p>'+q.e+'</p>'+(ok?'':'<p class="muted">間違えた論点：'+q.t+'</p>')+'<button onclick="pos++;show()">次へ →</button></div>'}
function finish(){app.innerHTML='<div class="card"><h2>結果</h2><p><b>'+score+' / '+pool.length+'問</b> 正解</p><button class="main" onclick="home()">ホームへ</button></div>'}
function status(){let y=S.days[day(-1)],w=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]);let h='<div class="card"><h2>📊 学習状況</h2><p>今日：'+(S.days[day()]?.done||0)+'問 / 正解 '+(S.days[day()]?.ok||0)+'問</p><p>昨日：'+(y?.done||0)+'問 / 正解 '+(y?.ok||0)+'問</p><h3>間違いが多い論点</h3>';h+=w.length?w.slice(0,8).map(x=>'<span class="pill">'+x[0]+'：'+x[1]+'回</span>').join(''):'<p>まだありません</p>';if(y?.topics){h+='<h3>昨日やった論点</h3>';Object.keys(y.topics).forEach(t=>h+='<button onclick="quick(\''+t+'\')">'+t+'（'+y.topics[t]+'問）</button>')}h+='<button class="back" onclick="home()">← ホーム</button></div>';app.innerHTML=h}
function quick(t){for(let c in cats)if(cats[c].includes(t))return setup(c,t)}home();</script></body></html>
