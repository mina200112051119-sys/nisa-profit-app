<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簿記1級 学習アプリ v9</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7fb;margin:0;color:#222}.wrap{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000012}h1{font-size:24px}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:13px;background:#eee;font-size:16px;text-align:left}button.main{background:#222;color:white}button:disabled{opacity:.55}.small{font-size:13px;color:#666}.q{font-size:18px;font-weight:700;line-height:1.6}.entry{font-family:ui-monospace,monospace;background:#f1f3f6;padding:14px;border-radius:12px;white-space:pre-wrap}.ok{font-weight:700}.bad{font-weight:700}.tag{display:inline-block;background:#eef1ff;border-radius:20px;padding:5px 9px;margin:3px;font-size:12px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.back{background:#ddd;text-align:center}</style></head><body><div class="wrap"><h1>📘 日商簿記1級</h1><div id="app"></div></div><script>
const qs=[
{topic:'現金預金',conf:'当座借越',q:'当座預金残高を超えて小切手を振り出し、銀行が立替えた。最も適切な処理は？',a:['当座預金／現金','当座借越／当座預金','現金／当座借越','当座預金／当座借越'],r:3,why:'銀行からの立替額は企業の負債となるため、当座借越を計上する。',confusion:'当座預金の残高内の支払いと、残高を超えた支払いの区別'},
{topic:'貸倒引当金',conf:'貸倒損失',q:'決算で売掛金に対して貸倒引当金を設定する。仕訳の考え方は？',a:['貸倒引当金繰入／貸倒引当金','貸倒引当金／貸倒引当金繰入','貸倒損失／売掛金','売掛金／貸倒引当金'],r:1,why:'将来の貸倒れに備える見積額を当期の費用として認識するため。',confusion:'まだ確定していない貸倒れは引当金、確定した貸倒れは貸倒損失'},
{topic:'有価証券',conf:'評価差額',q:'その他有価証券を期末時価評価した。評価差額を原則としてどこに表示する？',a:['営業外収益','特別利益','その他有価証券評価差額金','売上'],r:3,why:'その他有価証券の評価差額は原則として純資産の部に計上する。',confusion:'売買目的有価証券は損益、その他有価証券は評価差額金'},
{topic:'収益認識',conf:'本人/代理人',q:'商品を顧客へ移転する約束について、企業が本人である場合の収益認識は？',a:['手数料相当額だけ','顧客から受け取る対価の総額を基礎に認識','収益を認識しない','仕入額だけ'],r:2,why:'本人として履行義務を充足する場合、総額表示が基本となる。',confusion:'本人なら総額、代理人なら手数料等の純額が基本'},
{topic:'固定資産',conf:'売却/除却',q:'固定資産を帳簿価額より高い金額で売却した。差額はどう考える？',a:['固定資産売却益','売上高','資本剰余金','その他有価証券評価差額金'],r:1,why:'帳簿価額との差額は固定資産売却損益として処理する。',confusion:'通常の営業目的の商品販売と固定資産売却を区別'},

{topic:'企業結合',conf:'のれん',q:'企業結合で取得原価が識別可能純資産の時価を上回った差額は？',a:['のれん','資本剰余金','利益剰余金','売上'],r:1,why:'取得原価と受け入れた識別可能純資産の時価との差額をのれんとして処理する。',confusion:'負の差額を含め、取得原価と純資産の関係を確認する'},

{topic:'退職給付',conf:'費用/負債',q:'退職給付に関する将来の支給見込額を会計上認識する考え方は？',a:['退職給付費用・退職給付に係る負債など','売上','資本金','有価証券評価差額金'],r:1,why:'勤務期間に対応して退職給付を費用として認識し、対応する負債等を計上する。',confusion:'当期費用と将来支給の負債を混同しない'},
{topic:'標準原価',conf:'価格差異/数量差異',q:'材料の実際価格と標準価格の差から生じる差異は？',a:['材料価格差異','材料数量差異','操業度差異','売上差異'],r:1,why:'単価の差に着目するため価格差異。数量の差なら数量差異。',confusion:'価格＝単価、数量＝使用量'},
{topic:'CVP',conf:'限界利益/売上高',q:'限界利益率は何を表す？',a:['限界利益÷売上高','固定費÷売上高','売上高÷限界利益','変動費÷固定費'],r:1,why:'売上高のうち、変動費を回収した後に固定費・利益に回せる割合。',confusion:'限界利益額と限界利益率を区別'},
{topic:'直接原価計算',conf:'全部原価計算',q:'直接原価計算では固定製造原価を原則どう扱う？',a:['製品原価に全額含める','期間原価として扱う','売上高にする','資本にする'],r:2,why:'直接原価計算では変動製造原価を製品原価とし、固定製造原価を期間原価として扱う。',confusion:'全部原価計算との固定製造原価の扱い'},
{topic:'本支店',conf:'本店/支店',q:'本店と支店の内部取引を記録するとき、外部企業との取引と同じように扱う？',a:['はい、外部取引として扱う','いいえ、内部取引として管理する','必ず売上にする','必ず資本金にする'],r:2,why:'本支店は同一企業内の内部関係なので、本支店間取引として処理する。',confusion:'連結会社間取引と本支店間取引は似ているが対象が違う'}

let mode='home',idx=0,score=0;const key='bokiV9';let stat=JSON.parse(localStorage.getItem(key)||'{"wrong":{},"conf":{}}');
function save(){localStorage.setItem(key,JSON.stringify(stat))}function addWrong(q){stat.wrong[q.topic]=(stat.wrong[q.topic]||0)+1;stat.conf[q.conf]=(stat.conf[q.conf]||0)+1;save()}
function home(){mode='home';render()}function render(){let h='';if(mode==='home'){h='<div class="card"><div class="small">カテゴリー別の勉強もここから続けられます</div><button class="main" onclick="start(\'journal\')">✏️ 仕訳を解く</button><button onclick="start(\'why\')">🧠 なぜこの仕訳？</button><button onclick="start(\'conf\')">🔀 似た仕訳を見分ける</button><button onclick="start(\'category\')">📚 カテゴリー別に勉強</button><button onclick="status()">📊 学習状況・昨日の学習</button></div>'}else if(mode==='category'){h='<div class="card"><h2>📚 カテゴリー別に勉強</h2><p class="small">日商簿記1級の4分野を分けて学習。2026年度は商業簿記・会計学、工業簿記・原価計算の出題区分に沿って整理します。</p><div class="grid">'+['商業簿記','会計学','工業簿記','原価計算'].map(x=>`<button onclick="cat('${x}')">${x}</button>`).join('')+'</div><button class="back" onclick="home()">戻る</button></div>'}else if(mode==='cat'){h='<div class="card"><h2>📖 '+window.catName+'</h2>'+qs.filter(q=>q.topic.includes(window.catName==='商業簿記'?'': '')).slice(0,1).map(q=>'<p>このカテゴリーの重要論点を、仕訳・理由・混同ポイントの3方向から練習します。</p>').join('')+'<p class="small">カテゴリー学習では、間違えた論点を優先して出題する設計です。</p><button class="main" onclick="start(\'journal\')">このカテゴリーから解く</button><button onclick="start(\'why\')">理由問題</button><button onclick="start(\'conf\')">混同チェック</button><button class="back" onclick="renderHomeCategory()">カテゴリー一覧へ</button></div>'}else if(mode==='status'){h='<div class="card"><h2>📊 学習状況</h2><p>カテゴリー別の間違い</p>'+Object.entries(stat.wrong).map(([k,v])=>`<span class="tag">${k}: ${v}回</span>`).join('')+'<p>混同しやすい論点</p>'+Object.entries(stat.conf).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<span class="tag">${k}: ${v}回</span>`).join('')+'<hr><p class="small">昨日の学習も、この端末の履歴として残ります。次回は弱点を優先して出題します。</p><button class="back" onclick="home()">戻る</button></div>'}else{let q=qs[idx%qs.length];let title=mode==='journal'?'✏️ 仕訳を解く':mode==='why'?'🧠 なぜこの仕訳？':'🔀 似た仕訳を見分ける';let prompt=mode==='journal'?q.q:mode==='why'?`次の考え方になる理由は？\n「${q.a[q.r-1]}」`: `「${q.confusion}」を区別するとき、正しい考え方は？`;h='<div class="card"><div class="small">'+title+'　'+(idx+1)+'問目</div><p class="q">'+prompt.replace(/\n/g,'<br>')+'</p>'+(mode==='why'||mode==='conf'?'<div class="entry">'+q.a[q.r-1]+'</div>':'')+q.a.map((x,i)=>`<button onclick="ans(${i+1})">${x}</button>`).join('')+'<button class="back" onclick="home()">終了</button></div>'}document.getElementById('app').innerHTML=h}
function start(m){mode=m;idx=0;score=0;render()}function ans(n){let q=qs[idx%qs.length],correct=n===q.r; if(!correct)addWrong(q);let msg=correct?'⭕ 正解':'❌ 不正解';let explain=mode==='why'?q.why:mode==='conf'?q.confusion:q.why;document.getElementById('app').innerHTML=`<div class="card"><h2 class="${correct?'ok':'bad'}">${msg}</h2><p>${explain}</p><p><b>混同ポイント：</b>${q.confusion}</p><button class="main" onclick="next()">次の問題</button><button onclick="home()">ホームへ</button></div>`}function next(){idx++;render()}function status(){mode='status';render()}function cat(n){window.catName=n;mode='cat';render()}function renderHomeCategory(){mode='category';render()}render();</script></body></html>
