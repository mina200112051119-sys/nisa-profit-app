<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="簿記1級"><title>簿記1級 学習アプリ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#f6f7fb;color:#222}header{background:#222;color:#fff;padding:18px 16px;position:sticky;top:0}h1{font-size:20px;margin:0 0 4px}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left}.primary{text-align:center;background:#222;color:#fff}.choice{text-align:center}.ok{background:#e8f6ea}.ng{background:#fff0f0}.back{width:auto;padding:8px 12px}.small{font-size:12px;color:#666}.tag{display:inline-block;padding:4px 8px;border-radius:8px;background:#eee;font-size:12px}</style></head><body><header><h1>📘 簿記1級 学習アプリ</h1><div>基礎 → 仕訳 → 過去問 → 予想 → 弱点補強</div></header><main id="app"></main><script>const Q=[
['仕訳','売買目的有価証券','売買目的で購入した有価証券100万円を現金購入。借方は？',['有価証券100万円','現金100万円','投資有価証券100万円','評価損100万円'],0,'売買目的有価証券は資産。購入時は借方。','投資有価証券との区別'],
['仕訳','固定資産売却','帳簿価額80万円の固定資産を100万円で売却。売却益は？',['20万円','80万円','100万円','180万円'],0,'100−80＝20万円。','取得原価と帳簿価額の混同'],
['仕訳','貸倒引当金','売掛金100万円の5%を貸倒引当金にする。必要額は？',['5万円','20万円','95万円','105万円'],0,'100×5%＝5万円。','引当金額と回収不能額の混同'],
['仕訳','税効果会計','将来減算一時差異から生じるものは？',['繰延税金資産','繰延税金負債','のれん','資本金'],0,'将来の税金を減らす効果があるため繰延税金資産。','将来減算＝資産、将来加算＝負債'],
['仕訳','連結','親会社の子会社への貸付金と子会社の借入金は連結上どうする？',['消去する','売上にする','残す','資本金にする'],0,'グループ内の債権・債務なので相殺消去。','内部取引と外部取引の区別'],
['基礎','その他の包括利益累計額','その他の包括利益累計額に含まれるものは？',['為替換算調整勘定','臨時巨額損失','売上高','支払利息'],0,'為替換算調整勘定が含まれる。','損益項目との区別'],
['基礎','企業結合','取得原価が識別可能純資産の時価を上回る差額は？',['のれん','売上高','繰延税金資産','為替換算調整勘定'],0,'基本的にのれん。','負ののれんとの区別'],
['基礎','収益認識','代理人に該当する場合、原則として売上高は？',['手数料等の純額','取引価格の総額','仕入原価','利益の2倍'],0,'代理人は原則として純額表示。','本人＝総額、代理人＝純額'],
['基礎','減損','回収可能価額は正味売却価額と使用価値のどちらか？',['高い方','低い方','平均','取得原価'],0,'高い方。','高い方・低い方の混同'],
['原価計算','標準原価','実際原価が標準原価より高い場合は？',['不利差異','有利差異','差異なし','利益差異'],0,'実際原価が高いほど不利。','有利・不利の方向'],
['原価計算','材料差異','実際価格が標準価格より高かった。何差異？',['価格差異','数量差異','操業度差異','為替差異'],0,'価格の違いなので価格差異。','価格差異と数量差異'],
['原価計算','材料差異','材料を標準より多く使用した。何差異？',['数量差異','価格差異','税差異','売上差異'],0,'使用数量の違いなので数量差異。','数量差異と価格差異'],
['仕訳','有価証券評価','売買目的有価証券を期末に時価評価する目的は？',['期末時価を反映するため','税率を決めるため','資本金を増やすため','売上を計上するため'],0,'売買目的有価証券は期末時価評価。','取得原価評価との区別'],
['仕訳','外貨換算','外貨建金銭債権債務は原則として期末に何で換算する？',['決算時の為替相場','取得時の為替相場','平均株価','標準原価'],0,'期末の為替相場で換算する。','取引時レートとの区別'],
['基礎','退職給付','将来の退職給付を現在価値にするために使うものは？',['割引率','税率','原価差異','配当率'],0,'将来のお金を現在価値に換算するため割引率を使う。','割引率と利率の混同'],
['基礎','連結','親会社と子会社の内部売上・仕入は連結上どうする？',['消去する','売上だけ残す','仕入だけ残す','資本金にする'],0,'グループ内取引なので消去する。','外部売上との区別'],
['原価計算','CVP','損益分岐点では利益はいくら？',['0','売上高と同額','固定費','変動費'],0,'売上高＝総費用となり利益は0。','損益分岐点と目標利益点の区別'],
['原価計算','直接原価計算','直接原価計算で固定製造間接費は原則どう扱う？',['期間費用','製品原価に全部配賦','資産にする','売上原価から除く'],0,'固定製造間接費は期間費用として扱う。','全部原価計算との区別'],
['基礎','減損','帳簿価額1000万円、回収可能価額700万円。減損損失は？',['300万円','200万円','700万円','1000万円'],0,'1000−700＝300万円。','回収可能価額と損失額の混同'],
['基礎','税効果会計','将来加算一時差異から生じるものは？',['繰延税金負債','繰延税金資産','のれん','売上高'],0,'将来加算一時差異は繰延税金負債。','将来減算との区別']
];let S=JSON.parse(localStorage.bokiV4||'{"done":0,"correct":0,"wrong":{}}'),cur=[],i=0,mode='';const A=document.getElementById('app');function save(){localStorage.bokiV4=JSON.stringify(S)}function home(){A.innerHTML='<div class="card"><h2>今日は何をする？</h2><button onclick="learn()">📖 勉強する<br><span class="small">論点を1つずつ覚える</span></button><button onclick="start(\'仕訳\')">✏️ 仕訳を解く<br><span class="small">単純問題から慣れる</span></button><button onclick="start(\'過去問\')">📚 過去問に近い問題<br><span class="small">実際の出題論点を練習</span></button><button onclick="start(\'予想\')">🔮 予想問題<br><span class="small">弱点を優先して出題</span></button><button onclick="status()">📊 学習状況</button></div><div class="card"><b>学習の流れ</b><p>基礎 → 仕訳 → 類題 → 過去問 → 予想 → 間違い分析</p><p class="small">過去問そのものではなく、公式問題の出題論点を参考にしたオリジナル問題です。</p></div>'}function learn(){let ts=[...new Set(Q.map(x=>x[1]))];A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📖 勉強する</h2>'+ts.map(t=>'<button onclick="lesson(\''+t+'\')">'+t+'</button>').join('')+'</div>'}function lesson(t){let q=Q.find(x=>x[1]===t);A.innerHTML='<button class="back" onclick="learn()">← 戻る</button><div class="card"><span class="tag">'+q[0]+' / '+t+'</span><h2>'+t+'</h2><p><b>まず覚える</b></p><p>'+q[5]+'</p><p><b>混同ポイント</b></p><p>'+q[6]+'</p><button class="primary" onclick="one(\''+t+'\')">1問だけ確認する</button></div>'}function one(t){cur=Q.filter(x=>x[1]===t);i=0;mode='確認';show()}function start(m){mode=m;if(m==='仕訳')cur=Q.filter(x=>x[0]==='仕訳');else if(m==='過去問')cur=Q.filter(x=>x[0]!=='仕訳');else cur=[...Q].sort((a,b)=>(S.wrong[b[1]]||0)-(S.wrong[a[1]]||0));cur=cur.sort(()=>Math.random()-.5).slice(0,10);i=0;show()}function show(){if(i>=cur.length)return finish();let q=cur[i];A.innerHTML='<button class="back" onclick="home()">← 終了</button><div class="small">'+(i+1)+'/'+cur.length+'　'+mode+'</div><div class="card"><span class="tag">'+q[1]+'</span><h2>'+q[2]+'</h2>'+q[3].map((x,n)=>'<button class="choice" onclick="answer('+n+')">'+String.fromCharCode(65+n)+'　'+x+'</button>').join('')+'</div>'}function answer(n){let q=cur[i],ok=n===q[4];S.done++;if(ok)S.correct++;else S.wrong[q[1]]=(S.wrong[q[1]]||0)+1;save();document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('ok');if(k===n&&!ok)b.classList.add('ng')});let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+(ok?'⭕ 正解':'❌ 不正解')+'</h3><p>'+q[5]+'</p><p><b>混同ポイント：</b>'+q[6]+'</p><button class="primary" onclick="i++;show()">次の問題</button>';A.appendChild(d)}function finish(){A.innerHTML='<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>終了</h2><p>累計正解率：<b>'+((S.correct/S.done*100)||0).toFixed(0)+'%</b></p><button class="primary" onclick="home()">ホームへ</button></div>'}function status(){let r=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]);A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📊 学習状況</h2><p>解答数：'+S.done+'　正解数：'+S.correct+'</p><h3>間違いが多い論点</h3>'+(r.length?r.map(x=>'<p>'+x[0]+'：'+x[1]+'回</p>').join(''):'<p>まだ記録がないよ。</p>')+'</div>'}home();</script></main></body></html>
