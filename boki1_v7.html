['原計','差額原価','差額原価収益分析で比較するのは？',['代替案によって変化する収益と原価','全社の過去原価だけ','資本金だけ','固定資産の取得原価だけ'],0,'意思決定による増減を見る。','差額と総額の混同']
];
let S=JSON.parse(localStorage.bokiV7||'{"done":0,"correct":0,"wrong":{},"conf":{}}'),cur=[],idx=0,mode='';const A=document.getElementById('app');
function save(){localStorage.bokiV7=JSON.stringify(S)}
function home(){A.innerHTML='<div class="card"><h2>今日は何をする？</h2><button onclick="learn()">📖 勉強する<br><span class="small">論点を選んで基礎から</span></button><button onclick="start(10)">⚡ とにかく10問<br><span class="small">すき間時間用</span></button><button onclick="start(50)">🔥 とにかく50問</button><button onclick="start(100)">💪 とにかく100問</button><button onclick="startPast()">📚 過去問に近い問題<br><span class="small">公式の出題論点を参考にした問題</span></button><button onclick="startPred()">🔮 予想問題<br><span class="small">間違いの多い論点を優先</span></button><button onclick="status()">📊 学習状況</button></div><div class="card"><b>現在の問題数：'+Q.length+'問</b><p class="small">問題文は公式過去問の転載ではなく、出題論点をもとに作ったオリジナル問題。</p></div>'}
function learn(){let m={};Q.forEach(q=>(m[q[0]]??=[]).push(q[1]));A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📖 勉強する</h2>'+Object.entries(m).map(([s,arr])=>'<h3>'+s+'</h3>'+[...new Set(arr)].map(t=>'<button onclick="lesson(\''+t+'\')">'+t+'　<span class="small">'+Q.filter(q=>q[1]===t).length+'問</span></button>').join('')).join('')+'</div>'}
function lesson(t){let q=Q.find(x=>x[1]===t);A.innerHTML='<button class="back" onclick="learn()">← 論点一覧</button><div class="card"><span class="tag">'+q[0]+' / '+t+'</span><h2>'+t+'</h2><p><b>まず覚える</b></p><p>'+q[5]+'</p><p><b>混同ポイント</b></p><p>'+q[6]+'</p><button class="primary" onclick="oneTopic(\''+t+'\')">この論点を解く</button></div>'}
function oneTopic(t){cur=Q.filter(q=>q[1]===t);idx=0;mode=t;show()}
function start(n){cur=[...Q].sort(()=>Math.random()-.5).slice(0,Math.min(n,Q.length));idx=0;mode=n+'問';show()}
function startPast(){let arr=Q.filter(q=>['商会','会計学','工簿','原計'].includes(q[0]));cur=arr.sort(()=>Math.random()-.5).slice(0,Math.min(20,arr.length));idx=0;mode='過去問に近い';show()}
function startPred(){let arr=[...Q].sort((a,b)=>(S.wrong[b[1]]||0)-(S.wrong[a[1]]||0));cur=arr.slice(0,Math.min(20,arr.length));idx=0;mode='予想';show()}
function show(){if(idx>=cur.length)return finish();let q=cur[idx],p=Math.round(idx/cur.length*100);A.innerHTML='<button class="back" onclick="home()">← 終了</button><div class="small">'+mode+'　'+(idx+1)+'/'+cur.length+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="card"><span class="tag">'+q[0]+' / '+q[1]+'</span><h2>'+q[2]+'</h2>'+q[3].map((x,n)=>'<button class="choice" onclick="answer('+n+')">'+String.fromCharCode(65+n)+'　'+x+'</button>').join('')+'</div>'}
function answer(n){let q=cur[idx],ok=n===q[4];S.done++;if(ok)S.correct++;else{S.wrong[q[1]]=(S.wrong[q[1]]||0)+1;S.conf[q[6]]=(S.conf[q[6]]||0)+1}save();document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('ok');if(k===n&&!ok)b.classList.add('ng')});let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+(ok?'⭕ 正解':'❌ 不正解')+'</h3><p>'+q[5]+'</p><p><b>混同ポイント：</b>'+q[6]+'</p><button class="primary" onclick="idx++;show()">次の問題</button>';A.appendChild(d)}
function finish(){let rate=S.done?Math.round(S.correct/S.done*100):0;A.innerHTML='<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>終了</h2><p>今回の問題が終わったよ。</p><p>累計：'+S.done+'問　正解：'+S.correct+'問　正解率：<b>'+rate+'%</b></p><button class="primary" onclick="home()">ホームへ</button></div>'}
function status(){let w=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]),c=Object.entries(S.conf).sort((a,b)=>b[1]-a[1]);A.innerHTML='<button class="back" onclick="home()">← 戻る</button><div class="card"><h2>📊 学習状況</h2><p>解答数：'+S.done+'　正解数：'+S.correct+'　正解率：'+(S.done?Math.round(S.correct/S.done*100):0)+'%</p><h3>苦手論点</h3>'+(w.length?w.slice(0,10).map(x=>'<p>'+x[0]+'：'+x[1]+'回</p>').join(''):'<p>まだ記録なし</p>')+'<h3>混同しているポイント</h3>'+(c.length?c.slice(0,10).map(x=>'<p>'+x[0]+'：'+x[1]+'回</p>').join(''):'<p>まだ記録なし</p>')+'</div>'}home();
</script></main></body></html>
